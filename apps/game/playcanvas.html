<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#14251f" />
  <meta name="description" content="AKWANTUO PlayCanvas world prototype — a Ghana-inspired open-world game." />
  <title>AKWANTUO — PlayCanvas World</title>
  <link rel="preload" href="/assets/characters/generated/player.glb" as="fetch" crossorigin="anonymous" />
</head>
<body>
  <main id="game">
    <canvas id="application" aria-label="AKWANTUO playable Ghana-inspired 3D world"></canvas>
    <header class="top-hud"><a href="./" class="wordmark">AKWANTUO<span>.</span></a><div><strong id="district">OSU · ACCRA</strong><small id="world-status">LOADING WORLD</small></div></header>
    <section class="health-hud" aria-label="Player health">
      <div class="health-label"><span>♥</span><strong>HEALTH</strong><b id="health-value">100</b></div>
      <div class="health-track"><span id="health-fill"></span></div>
    </section>
    <div class="touch-ui" id="on-foot-hud">
      <div class="stick" id="stick" role="application" aria-label="Movement joystick"><div class="stick-ring"></div><div class="stick-knob" id="stick-knob"></div></div>
      <div class="action-cluster">
        <div class="context-label" id="context-label" aria-live="polite"></div>
        <button class="action-button jump-button" id="jump" type="button" aria-label="Jump">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>
        </button>
        <button class="action-button interact-button" id="interact" type="button" aria-label="Interact">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 12V5.5a1.5 1.5 0 0 1 3 0V11 4.5a1.5 1.5 0 0 1 3 0V11 6a1.5 1.5 0 0 1 3 0v6-1a1.5 1.5 0 0 1 3 0v5.2A5.8 5.8 0 0 1 14.2 22h-1.1a6 6 0 0 1-4.6-2.1L4.7 15a1.7 1.7 0 0 1 2.5-2.3L10 15"/></svg>
        </button>
      </div>
      <div class="vehicle-controls" id="vehicle-controls" hidden aria-label="Vehicle controls">
        <div class="vehicle-steering">
          <div class="vehicle-stick" id="vehicle-stick" role="application" aria-label="Vehicle steering joystick">
            <div class="stick-ring"></div><div class="stick-knob" id="vehicle-stick-knob"></div>
          </div>
        </div>
        <div class="vehicle-pedals">
          <button class="vehicle-control accelerate-control" id="accelerate" type="button" aria-label="Gas, accelerate">GAS</button>
          <div class="vehicle-brake-stack">
            <button class="vehicle-exit" id="exit" type="button" aria-label="Exit car">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 15v-3l2-5h11l3 5v3H3Z"/><path d="M5 15v2m12-2v2M6 12h10M11 7v5"/><path d="M14 10l3 2-3 2m3-2h5"/></svg>
              <span>EXIT CAR</span>
            </button>
            <button class="vehicle-control reverse-control" id="reverse" type="button" aria-label="Brake and reverse">BRAKE / REVERSE</button>
          </div>
        </div>
      </div>
    </div>
    <button class="atlas-launcher" id="atlas-launcher" type="button" aria-label="Open ATLAS phone" aria-expanded="false"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3.5 27.5 16 16 28.5 4.5 16 16 3.5Z"/><path d="M9.5 19.5 16 9l6.5 10.5M12 16h8"/></svg><span>ATLAS</span></button>
    <aside class="atlas-panel" id="atlas-panel" aria-label="ATLAS One smartphone" hidden><div class="atlas-shell-bar"><span>ATLAS ONE</span><button id="atlas-close" type="button" aria-label="Close ATLAS phone">×</button></div><iframe src="/atlas/index.html" title="ATLAS OS phone" loading="lazy"></iframe></aside>
    <div class="crosshair" aria-hidden="true"></div>
    <div class="loading" id="loading"><div class="loader-mark">A</div><strong>AKWANTUO</strong><span id="loading-message">Building your world…</span></div>
    <div class="notice" id="notice" role="status"></div>
  </main>
  <script type="module" src="/src/playcanvas/main.ts"></script>
<script>
(() => { const panel=document.getElementById("atlas-panel"); const launcher=document.getElementById("atlas-launcher"); const close=document.getElementById("atlas-close"); if(!panel||!launcher||!close)return; const setOpen=(open)=>{panel.hidden=!open;launcher.setAttribute("aria-expanded",String(open));launcher.setAttribute("aria-label",open?"Close ATLAS phone":"Open ATLAS phone");}; launcher.addEventListener("click",()=>setOpen(panel.hidden)); close.addEventListener("click",()=>setOpen(false)); window.addEventListener("keydown",(event)=>{if(event.key==="Escape"&&!panel.hidden)setOpen(false);}); })();
</script>
</body>
</html>
