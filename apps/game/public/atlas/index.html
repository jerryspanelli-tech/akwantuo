<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>ATLAS OS</title>
<style>
:root{color-scheme:dark;--bg:#101820;--panel:#18232d;--panel2:#202d38;--line:#ffffff16;--muted:#9baab4;--ink:#f4f1e9;--gold:#e8b66a;--mint:#82c6b1}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080d12;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;color:inherit;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}.device{height:100%;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden;background:radial-gradient(ellipse at 85% 0%,#31414a 0,transparent 42%),linear-gradient(155deg,#17232d,#0d151d 72%);padding:clamp(13px,3vw,22px);gap:13px}.status{height:20px;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;letter-spacing:.04em;color:#e5e9e8}.status-right{display:flex;align-items:center;gap:7px}.signal{display:flex;gap:2px;align-items:end;height:11px}.signal i{display:block;width:3px;border-radius:2px;background:#e7ece9}.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:6px}.signal i:nth-child(3){height:8px}.signal i:nth-child(4){height:10px}.battery{width:18px;height:9px;border:1px solid #e7ece9;border-radius:3px;padding:1px;position:relative}.battery:after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:#e7ece9;border-radius:0 2px 2px 0}.battery span{display:block;width:78%;height:100%;background:var(--mint);border-radius:1px}.topbar{display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:9px}.brandmark{width:35px;height:35px;border:1px solid #e8b66a88;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#263640,#17232d);box-shadow:0 6px 20px #0003}.brandmark svg{width:23px;height:23px}.brandname{font-size:14px;font-weight:900;letter-spacing:.18em}.edition{font-size:9px;color:var(--muted);letter-spacing:.15em;margin-top:2px}.round{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#ffffff0d;border:1px solid var(--line);font-size:15px}.content{flex:1;min-height:0;overflow:auto;scrollbar-width:none}.content::-webkit-scrollbar{display:none}.greeting{padding:8px 1px 16px}.eyebrow{font-size:9px;letter-spacing:.2em;color:var(--gold);font-weight:800}.greeting h1{font-size:clamp(23px,5vw,30px);line-height:1.08;letter-spacing:-.04em;margin:8px 0 5px;font-weight:760}.greeting p{margin:0;color:#aebbc2;font-size:12px}.feature{position:relative;overflow:hidden;border-radius:20px;padding:16px;background:linear-gradient(115deg,#253943,#1c2b34 62%,#28353b);border:1px solid #ffffff1b;min-height:120px;display:flex;align-items:center}.feature:after{content:"";position:absolute;width:150px;height:150px;border:1px solid #e8b66a35;border-radius:50%;right:-30px;top:-25px;box-shadow:0 0 0 17px #e8b66a0b,0 0 0 36px #e8b66a08}.feature-copy{position:relative;z-index:1;max-width:68%}.feature-copy small{color:#e8b66a;font-size:9px;font-weight:800;letter-spacing:.18em}.feature-copy strong{display:block;font-size:17px;line-height:1.15;margin:7px 0}.feature-copy span{font-size:10px;color:#c1cbd0}.atlas-orbit{position:absolute;right:18px;top:24px;width:75px;height:75px;border:1px solid #e8b66a77;border-radius:50%;display:grid;place-items:center;transform:rotate(-24deg)}.atlas-orbit:before{content:"";position:absolute;width:96px;height:29px;border:1px solid #e8b66a99;border-radius:50%;transform:rotate(48deg)}.atlas-orbit:after{content:"";width:19px;height:19px;background:var(--gold);border-radius:50%;box-shadow:0 0 24px #e8b66a99}.section-head{display:flex;align-items:center;justify-content:space-between;margin:18px 1px 10px}.section-head strong{font-size:12px;letter-spacing:.02em}.section-head span{font-size:10px;color:var(--muted)}.apps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px 7px}.app{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;padding:0;min-width:0}.app-icon{width:clamp(48px,12vw,58px);height:clamp(48px,12vw,58px);border-radius:17px;display:grid;place-items:center;border:1px solid #ffffff16;box-shadow:0 7px 15px #0002}.app-icon svg{width:23px;height:23px;fill:none;stroke:#f7f5ef;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.app-label{font-size:9px;color:#e4e9e8;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}.messages{background:linear-gradient(145deg,#287c72,#174b4c)}.maps{background:linear-gradient(145deg,#b18a4c,#66502e)}.wallet{background:linear-gradient(145deg,#526a8d,#293d5a)}.camera{background:linear-gradient(145deg,#69757d,#35434c)}.notes{background:linear-gradient(145deg,#98744e,#59432f)}.settings{background:linear-gradient(145deg,#66727b,#38444d)}.music{background:linear-gradient(145deg,#86648d,#493b63)}.market{background:linear-gradient(145deg,#a85c4c,#65372f)}.quickrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.quick{border:1px solid var(--line);background:#ffffff09;border-radius:13px;padding:10px 8px;display:flex;align-items:center;gap:7px;font-size:10px;color:#dce4e3}.quick b{font-size:14px;color:var(--gold)}.dock{display:flex;justify-content:space-around;align-items:center;padding:10px 7px;border-radius:19px;background:#ffffff0d;border:1px solid #ffffff18;backdrop-filter:blur(15px)}.dock button{background:transparent;display:grid;place-items:center;gap:4px;font-size:8px;color:#b9c4c8}.dock svg{width:20px;height:20px;stroke:#f0f1eb;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}.home-indicator{height:4px;width:92px;border-radius:9px;background:#f1f2ec99;align-self:center;margin-top:-5px}.appview{height:100%;display:flex;flex-direction:column;gap:14px}.apphead{display:flex;align-items:center;gap:10px;padding:5px 0 9px;border-bottom:1px solid var(--line)}.back{width:33px;height:33px;border-radius:50%;background:#ffffff10;font-size:20px}.apphead strong{font-size:15px}.appbody{overflow:auto;min-height:0;flex:1}.tile{padding:14px;border:1px solid var(--line);background:#ffffff09;border-radius:15px;margin-bottom:9px}.tile strong{font-size:12px;display:block;margin-bottom:5px}.tile p{font-size:10px;color:var(--muted);line-height:1.5;margin:0}.placeholder{padding:24px 15px;text-align:center;color:var(--muted);font-size:11px;line-height:1.6}.settingrow{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line);font-size:11px}.pill{font-size:9px;color:var(--mint);background:#82c6b11c;padding:5px 8px;border-radius:20px}.balance{font-size:28px;font-weight:800;letter-spacing:-.04em}.balance small{font-size:10px;color:var(--muted);font-weight:500}.map-art{height:190px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,#253c3d,#34494a);position:relative;border:1px solid var(--line)}.map-art svg{width:100%;height:100%}.map-caption{font-size:10px;color:var(--muted);margin-top:8px}.phone-toast{position:absolute;left:50%;bottom:70px;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:9px 13px;border-radius:20px;background:#f0eadf;color:#17232a;font-size:10px;font-weight:800;white-space:nowrap;transition:.2s}.phone-toast.show{opacity:1;transform:translate(-50%,0)}@media(max-height:560px){.device{gap:7px;padding:10px 15px}.greeting{padding:1px 1px 9px}.greeting h1{font-size:22px;margin:5px 0}.feature{min-height:90px;padding:12px}.apps{gap:9px 5px}.app-icon{width:43px;height:43px;border-radius:14px}.section-head{margin:12px 1px 7px}.quickrow{margin-top:10px}.dock{padding:7px}}
</style>
</head>
<body>
<div class="device">
  <div class="status"><span id="clock">09:41</span><div class="status-right"><span>5G</span><span class="signal"><i></i><i></i><i></i><i></i></span><span class="battery"><span></span></span></div></div>
  <div class="topbar"><div class="brand"><div class="brandmark"><svg viewBox="0 0 32 32" fill="none" aria-label="ATLAS mark"><path d="M16 3.5 27.5 16 16 28.5 4.5 16 16 3.5Z" stroke="#E8B66A" stroke-width="1.5"/><path d="M9.5 19.5 16 9l6.5 10.5M12 16h8" stroke="#F4F1E9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><div class="brandname">ATLAS</div><div class="edition">ONE · PERSONAL DEVICE</div></div></div><button class="round" id="profile" aria-label="Profile">◉</button></div>
  <main class="content" id="content">
    <section id="home">
      <div class="greeting"><div class="eyebrow">TUESDAY, YOUR WORLD AWAITS</div><h1>Good morning,<br>Explorer.</h1><p>Everything you need, one place.</p></div>
      <div class="feature"><div class="feature-copy"><small>ATLAS MOMENT</small><strong>Your world.<br>Your direction.</strong><span>Move freely. Stay connected.</span></div><div class="atlas-orbit"></div></div>
      <div class="section-head"><strong>Your apps</strong><span>All systems ready</span></div>
      <div class="apps">
        <button class="app" data-app="messages"><span class="app-icon messages"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l-1 2v-5.5A7.5 7.5 0 1 1 20 11.5Z"/><path d="M8 11h8M8 14h5"/></svg></span><span class="app-label">Messages</span></button>
        <button class="app" data-app="maps"><span class="app-icon maps"><svg viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"/><path d="M9 3v15m6-12v15"/></svg></span><span class="app-label">Atlas Maps</span></button>
        <button class="app" data-app="wallet"><span class="app-icon wallet"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 9h18M16 14h2"/></svg></span><span class="app-label">Wallet</span></button>
        <button class="app" data-app="camera"><span class="app-icon camera"><svg viewBox="0 0 24 24"><path d="M4 8h4l2-3h4l2 3h4v11H4V8Z"/><circle cx="12" cy="13.5" r="3.5"/></svg></span><span class="app-label">Camera</span></button>
        <button class="app" data-app="notes"><span class="app-icon notes"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7m-7 4h7"/></svg></span><span class="app-label">Notes</span></button>
        <button class="app" data-app="settings"><span class="app-icon settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.2 1-1.4 2.4-1.5-.6a7.7 7.7 0 0 1-1.7 1l-.3 1.6h-2.8l-.3-1.6a7.7 7.7 0 0 1-1.7-1l-1.5.6-1.4-2.4 1.2-1a7 7 0 0 1 0-2l-1.2-1 1.4-2.4 1.5.6a7.7 7.7 0 0 1 1.7-1l.3-1.6h2.8l.3 1.6a7.7 7.7 0 0 1 1.7 1l1.5-.6 1.4 2.4-1.2 1a7 7 0 0 1 0 2Z"/></svg></span><span class="app-label">Settings</span></button>
        <button class="app" data-app="music"><span class="app-icon music"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></span><span class="app-label">Sound</span></button>
        <button class="app" data-app="market"><span class="app-icon market"><svg viewBox="0 0 24 24"><path d="M4 9h16l-1 12H5L4 9Z"/><path d="M8 9a4 4 0 0 1 8 0M9 13v.1m6-.1v.1"/></svg></span><span class="app-label">Market</span></button>
      </div>
      <div class="section-head"><strong>Quick controls</strong><span>Device shortcuts</span></div>
      <div class="quickrow"><button class="quick" data-toast="Connections panel is ready"><b>⌁</b> Network</button><button class="quick" data-toast="Do not disturb is off"><b>◐</b> Focus</button><button class="quick" data-toast="Battery health: 100%"><b>ϟ</b> Battery</button></div>
    </section>
    <section id="appview" hidden></section>
  </main>
  <nav class="dock"><button data-app="messages"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l-1 2v-5.5A7.5 7.5 0 1 1 20 11.5Z"/></svg>Messages</button><button data-app="maps"><svg viewBox="0 0 24 24"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"/></svg>Maps</button><button data-app="wallet"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="3"/><path d="M3 9h18"/></svg>Wallet</button><button data-app="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 13.5 21 15l-2 3-2.5-1-2 1-.5 2h-4l-.5-2-2-1L5 18l-2-3 2-1.5v-2L3 10l2-3 2.5 1 2-1 .5-2h4l.5 2 2 1L18 7l2 3-1 1.5v2Z"/></svg>Settings</button></nav>
  <div class="home-indicator"></div><div class="phone-toast" id="toast"></div>
</div>
<script>
const content=document.getElementById('content'),home=document.getElementById('home'),view=document.getElementById('appview'),toast=document.getElementById('toast');
const appData={
messages:['Messages','<div class="tile"><strong>AKWANTUO NETWORK</strong><p>Your in-world messages and contacts will appear here.</p></div><div class="placeholder">Your conversations will live here.<br>Stay close to your people.</div>'],
maps:['Atlas Maps','<div class="map-art"><svg viewBox="0 0 360 190" preserveAspectRatio="xMidYMid slice"><path d="M-20 45 380 150M-10 130 370 35M70 -10 150 210M260 -10 205 210" stroke="#8caa91" stroke-width="13" opacity=".55" fill="none"/><path d="M-20 45 380 150M-10 130 370 35M70 -10 150 210M260 -10 205 210" stroke="#d5c99d" stroke-width="2" stroke-dasharray="7 7" fill="none"/><path d="M0 170 Q100 130 180 150 T380 115" stroke="#5aa3ad" stroke-width="18" fill="none"/><circle cx="180" cy="92" r="8" fill="#e8b66a" stroke="#fff" stroke-width="3"/></svg></div><div class="map-caption">Greater Accra · Map connection preview</div><div class="tile"><strong>Explore your surroundings</strong><p>Navigation will connect to the AKWANTUO world map.</p></div>'],
wallet:['Wallet','<div class="tile"><div class="eyebrow">AKWANTUO BALANCE</div><div class="balance">GH₵ 0.00</div><p>In-game funds · Secure wallet preview</p></div><div class="tile"><strong>Recent activity</strong><p>No transactions yet.</p></div>'],
camera:['Camera','<div class="placeholder">◉<br><br>Capture your moments in AKWANTUO.<br>Camera integration is planned for a later build.</div>'],
notes:['Notes','<div class="tile"><strong>Quick note</strong><textarea placeholder="Write something..." style="width:100%;min-height:110px;background:#0e171e;border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px;resize:vertical;font:inherit;font-size:11px"></textarea></div>'],
settings:['Settings','<div class="tile"><strong>ATLAS One</strong><p>ATLAS OS · Concept build 0.1</p></div><div class="settingrow">Display <span class="pill">Adaptive</span></div><div class="settingrow">Sound & haptics <span class="pill">On</span></div><div class="settingrow">Privacy <span>›</span></div><div class="settingrow">About ATLAS <span>›</span></div>'],
music:['Sound','<div class="placeholder">Your sound library will appear here.<br>Original ATLAS notification tones are planned.</div>'],
market:['Market','<div class="tile"><strong>AKWANTUO MARKET</strong><p>Discover services, goods and in-world essentials.</p></div><div class="placeholder">The marketplace is being prepared.</div>']
};
function openApp(id){const data=appData[id];if(!data)return;home.hidden=true;view.hidden=false;view.innerHTML='<div class="appview"><div class="apphead"><button class="back" id="back" aria-label="Back">‹</button><strong>'+data[0]+'</strong></div><div class="appbody">'+data[1]+'</div></div>';document.getElementById('back').addEventListener('click',goHome);content.scrollTop=0}
function goHome(){view.hidden=true;home.hidden=false;content.scrollTop=0}
document.querySelectorAll('[data-app]').forEach(el=>el.addEventListener('click',()=>openApp(el.dataset.app)));
document.getElementById('profile').addEventListener('click',()=>openApp('settings'));
document.querySelectorAll('[data-toast]').forEach(el=>el.addEventListener('click',()=>showToast(el.dataset.toast)));
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(window._atlasToast);window._atlasToast=setTimeout(()=>toast.classList.remove('show'),1700)}
function tick(){const d=new Date();document.getElementById('clock').textContent=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false})}tick();setInterval(tick,30000);
document.addEventListener('keydown',e=>{if(e.key==='Escape')goHome()});
</script>
</body></html>
