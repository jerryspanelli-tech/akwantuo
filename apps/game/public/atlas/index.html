/* ZENVIA Tab: tablet-first workspace and wallpaper-safe layout. */
.device{
  padding:clamp(16px,2.5vw,30px);
  gap:clamp(10px,1.6vw,18px);
  background:
    radial-gradient(ellipse at 82% 18%,#b18a4b30 0,transparent 30%),
    radial-gradient(ellipse at 12% 85%,#4d829044 0,transparent 38%),
    linear-gradient(135deg,#101a22 0%,#1b2c35 48%,#101820 100%);
}
.device:before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.25;
  background:
    radial-gradient(ellipse at 78% 44%,transparent 0 16%,#e8b66a22 16.2% 16.35%,transparent 16.6% 23%,#e8b66a18 23.2% 23.35%,transparent 23.6%),
    linear-gradient(115deg,transparent 48%,#ffffff08 48.1%,transparent 48.4%);
}
.status{height:22px;position:relative;z-index:1;font-size:12px}
.topbar{position:relative;z-index:1}
.brandmark{width:42px;height:42px;border-radius:14px}
.brandname{font-size:16px;letter-spacing:.2em}
.edition{font-size:9px}
.content{position:relative;z-index:1}
#home{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(260px,.95fr);grid-template-rows:auto auto 1fr;column-gap:clamp(18px,3vw,34px);align-content:start;min-height:100%}
.greeting{grid-column:1;grid-row:1;padding:clamp(12px,2vw,24px) 2px 18px}
.greeting h1{font-size:clamp(28px,4.2vw,48px);max-width:520px;line-height:1.04}
.greeting p{font-size:13px}
.feature{grid-column:1;grid-row:2;min-height:clamp(150px,24vh,210px);border-radius:22px;padding:clamp(18px,2.4vw,28px);background:linear-gradient(115deg,#263c46d9,#1b2c35d9 62%,#33434ad9)}
.feature-copy{max-width:75%}
.feature-copy strong{font-size:clamp(20px,2.6vw,28px);line-height:1.15}
.feature-copy span{font-size:12px}
.atlas-orbit{width:clamp(78px,10vw,112px);height:clamp(78px,10vw,112px);right:clamp(18px,3vw,36px);top:50%;transform:translateY(-50%) rotate(-24deg)}
.section-head{margin:18px 1px 12px}
.apps{grid-column:2;grid-row:1 / span 3;align-content:start;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(14px,2.4vh,24px) 12px;padding:clamp(12px,2vw,24px) 0}
.app-icon{width:clamp(58px,7vw,76px);height:clamp(58px,7vw,76px);border-radius:20px}
.app-icon svg{width:28px;height:28px}
.app-label{font-size:11px}
#home>.section-head{grid-column:2;grid-row:1;align-self:start;margin-top:0;z-index:2}
#home>.apps{grid-column:2;grid-row:1 / span 3;padding-top:44px}
.quickrow{grid-column:1;grid-row:3;align-self:end;margin-top:18px}
.quick{font-size:11px;padding:12px}
.dock{position:relative;z-index:1;max-width:520px;align-self:center;width:min(100%,520px);padding:12px 18px}
.dock button{font-size:9px}
.dock svg{width:22px;height:22px}
.home-indicator{position:relative;z-index:1}
.appview{position:relative;z-index:1}
.apphead strong{font-size:18px}
.appbody{font-size:13px}
.tile{padding:18px}
.tile strong{font-size:14px}
.tile p{font-size:12px}
.placeholder{font-size:13px}
.tablet-toast{position:absolute;left:50%;bottom:78px;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:10px 16px;border-radius:20px;background:#f0eadf;color:#17232a;font-size:11px;font-weight:800;white-space:nowrap;transition:.2s;z-index:5}
.tablet-toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:650px){
  #home{grid-template-columns:1fr;grid-template-rows:auto auto auto auto}
  .greeting{grid-column:1;grid-row:1;padding:6px 1px 12px}
  .greeting h1{font-size:clamp(25px,7vw,34px)}
  .feature{grid-column:1;grid-row:2;min-height:118px}
  #home>.section-head{grid-column:1;grid-row:3;margin-top:15px}
  #home>.apps{grid-column:1;grid-row:4;grid-template-columns:repeat(4,minmax(0,1fr));padding:0;gap:14px 6px}
  .app-icon{width:clamp(48px,13vw,60px);height:clamp(48px,13vw,60px);border-radius:16px}
  .app-icon svg{width:23px;height:23px}
  .app-label{font-size:9px}
  .quickrow{grid-column:1;grid-row:5}
}
@media(max-height:520px) and (min-width:651px){
  .device{padding:10px 18px;gap:6px}
  #home{grid-template-columns:1fr 1fr}
  .greeting{padding:2px 1px 8px}
  .greeting h1{font-size:25px}
  .feature{min-height:100px}
  #home>.apps{gap:7px 8px;padding-top:34px}
  .app-icon{width:43px;height:43px;border-radius:13px}
  .app-icon svg{width:20px;height:20px}
  .app-label{font-size:8px}
  .quickrow{margin-top:8px}
}

/* Premium ZENVIA OS device experience: lock screen, status-only clock, and refined glass surfaces. */
.device{isolation:isolate;border-radius:inherit;background:
 radial-gradient(ellipse at 72% 14%,#b28b5545 0,transparent 29%),
 radial-gradient(ellipse at 18% 80%,#4b819055 0,transparent 34%),
 radial-gradient(ellipse at 50% 120%,#a27a4730 0,transparent 42%),
 linear-gradient(145deg,#0a121a 0%,#172832 48%,#0a131b 100%);padding:clamp(18px,3vw,34px);gap:clamp(12px,2vw,20px)}
.device:after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;opacity:.2;background:repeating-linear-gradient(128deg,transparent 0 54px,#d5b37b0c 55px,#d5b37b0c 56px,transparent 57px 112px),radial-gradient(ellipse at 50% 50%,transparent 35%,#0008 100%)}
.device>*{position:relative;z-index:1}
.status{height:24px;flex:none;font-size:13px;letter-spacing:.02em}
.top-actions{display:flex;align-items:center;gap:9px}
.round{width:39px;height:39px;border-radius:50%;background:#ffffff0b;border:1px solid #ffffff22;backdrop-filter:blur(18px);box-shadow:0 8px 24px #0003}
.topbar{min-height:44px}
.content{padding:0 2px}
.greeting h1{font-size:clamp(30px,4.6vw,48px);letter-spacing:-.055em;font-weight:720}
.greeting p{font-size:13px;color:#c0cbd0}
.feature{border-radius:26px;min-height:clamp(160px,25vh,220px);border:1px solid #ffffff25;box-shadow:inset 0 1px #ffffff18,0 18px 44px #0003;background:linear-gradient(115deg,#314a56d9,#1b303bdc 62%,#38434bd9)}
.feature:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#ffffff0b,transparent 38%,#d5ad6820);pointer-events:none}
.apps{gap:clamp(17px,2.8vh,27px) 15px}
.app{gap:8px;transition:transform .18s ease}
.app:active{transform:scale(.94)}
.app-icon{width:clamp(62px,7.5vw,78px);height:clamp(62px,7.5vw,78px);border-radius:24px;border:1px solid #ffffff35;box-shadow:inset 0 1px 1px #ffffff40,0 9px 22px #0004}
.app-icon svg{width:30px;height:30px;filter:drop-shadow(0 2px 3px #0005)}
.app-label{font-size:11px;font-weight:600;letter-spacing:.01em;text-shadow:0 2px 6px #0008}
.dock{border-radius:24px;background:linear-gradient(120deg,#ffffff16,#ffffff09);border:1px solid #ffffff25;box-shadow:inset 0 1px #ffffff20,0 14px 35px #0003;backdrop-filter:blur(26px);padding:13px 20px}
.dock button{font-size:9px;font-weight:650;gap:5px}
.dock svg{width:23px;height:23px}
.appview{gap:17px}
.apphead{padding:4px 0 13px;border-bottom:1px solid #ffffff20}
.back{width:38px;height:38px;border:1px solid #ffffff22;background:#ffffff10}
.apphead strong{font-size:21px;letter-spacing:-.03em}
.tile{border-radius:21px;background:linear-gradient(145deg,#ffffff12,#ffffff06);border:1px solid #ffffff20;box-shadow:inset 0 1px #ffffff10,0 9px 25px #0002}
.map-art{border-radius:22px}
.home-indicator{width:110px;height:4px;background:#ffffffb8;box-shadow:0 0 12px #ffffff45;margin-top:-4px}
.lock-screen{position:absolute;inset:0;z-index:8;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;padding:clamp(24px,5vw,48px);background:
 radial-gradient(ellipse at 72% 25%,#c39a5b55 0,transparent 30%),
 radial-gradient(ellipse at 20% 78%,#4b849c66 0,transparent 36%),
 linear-gradient(145deg,#09131d 0%,#18313b 48%,#0a141d 100%);color:#fff;touch-action:pan-y}
.lock-screen:before{content:"";position:absolute;inset:-25%;background:radial-gradient(ellipse at 50% 50%,transparent 0 23%,#e8bd7022 23.2% 23.35%,transparent 23.6% 36%,#e8bd7012 36.2% 36.35%,transparent 36.6%),linear-gradient(130deg,transparent 48%,#ffffff0c 48.2%,transparent 48.5%);transform:rotate(-12deg);pointer-events:none}
.lock-screen:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,#0004,transparent 30%,transparent 62%,#0008);pointer-events:none}
.lock-top,.lock-clock-wrap,.lock-bottom{position:relative;z-index:1}
.lock-top{display:flex;justify-content:space-between;align-items:center;font-size:10px;letter-spacing:.2em;font-weight:800;color:#f3eee3}
.lock-brand i{font-style:normal;color:#e8bd70;margin-left:4px}
.lock-weather{font-size:9px;color:#d1dadd;letter-spacing:.16em}
.lock-clock-wrap{margin-top:auto;margin-bottom:auto;text-align:center;padding:20px 0}
.lock-time{font-size:clamp(76px,16vw,132px);font-weight:250;letter-spacing:-.085em;line-height:.95;font-variant-numeric:tabular-nums;text-shadow:0 8px 35px #0005}
.lock-date{font-size:clamp(14px,2vw,18px);font-weight:550;letter-spacing:.015em;color:#e8e9e6;margin-top:15px}
.lock-bottom{display:flex;flex-direction:column;align-items:center;gap:17px}
.lock-hint{font-size:11px;color:#e0e5e4;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.lock-dot{width:6px;height:6px;border-radius:50%;background:#e8bd70;box-shadow:0 0 12px #e8bd70}
.unlock-button{display:flex;align-items:center;justify-content:space-between;gap:32px;min-width:148px;padding:11px 13px 11px 18px;border-radius:30px;border:1px solid #ffffff55;background:#ffffff14;backdrop-filter:blur(18px);color:#fff;font-size:9px;font-weight:900;letter-spacing:.2em;box-shadow:inset 0 1px #ffffff30,0 8px 25px #0003}
.unlock-button b{display:grid;place-items:center;width:27px;height:27px;border-radius:50%;background:#e8bd70;color:#16232a;font-size:17px;line-height:1}
.device.is-locked .status,.device.is-locked .topbar,.device.is-locked .content,.device.is-locked .dock,.device.is-locked .home-indicator{visibility:hidden;pointer-events:none}
.device:not(.is-locked) .lock-screen{display:none}
#home>.section-head{font-size:13px}
@media(max-width:650px){
 .device{padding:17px 18px 14px;gap:12px}

/* Unlocked home: remove the redundant device banner and protect the app row from the dock. */
.device:not(.is-locked) .topbar{display:none!important}
.device:not(.is-locked) .content{min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:8px}
.device:not(.is-locked) #home{min-height:0;grid-template-rows:auto auto auto auto;row-gap:0}
.device:not(.is-locked) .apps{grid-template-columns:repeat(4,minmax(0,1fr));align-content:start;gap:clamp(12px,2vh,20px) 8px;padding-top:clamp(8px,1.5vh,16px);padding-bottom:14px}
.device:not(.is-locked) .app{min-height:calc(clamp(48px,7.5vw,70px) + 22px);justify-content:flex-start}
.device:not(.is-locked) .app-icon{flex:none}
.device:not(.is-locked) .dock{flex:none;margin-top:4px}

 .device:not(.is-locked){gap:8px;padding:13px 15px 10px}

 .device:not(.is-locked) .app-label{font-size:9px}
 .device:not(.is-locked) .quickrow{margin-top:8px}

/* App mode: an opened app owns the tablet workspace; launcher and dock are removed. */
.device.is-app-open #content{display:flex;flex-direction:column;min-height:0;overflow:hidden}

};
function openApp(id){const data=appData[id];if(!data)return;if(id!=='maps')sendMapMessage('ZENVIA_MAP_CLOSE');device.classList.add('is-app-open');home.hidden=true;view.hidden=false;const head=id==='maps'?'<div class="apphead map-apphead"><button class="back" id="back" aria-label="Back">‹</button><span class="map-app-label">Maps</span></div>':'<div class="apphead"><button class="back" id="back" aria-label="Back">‹</button><strong>'+data[0]+'</strong></div>';view.innerHTML='<div class="appview">'+head+'<div class="appbody">'+data[1]+'</div></div>';document.getElementById('back').addEventListener('click',goHome);content.scrollTop=0;if(id==='maps')requestAnimationFrame(initZenviaMap)}
function goHome(){sendMapMessage('ZENVIA_MAP_CLOSE');device.classList.remove('is-app-open');view.hidden=true;home.hidden=false;content.scrollTop=0}
const zenviaMap={data:null,state:null,zoom:1,panX:0,panY:0,canvas:null,ctx:null,retry:null,drag:null};
function sendMapMessage(type){if(window.parent!==window)window.parent.postMessage({type},window.location.origin)}
function requestZenviaMap(){sendMapMessage('ZENVIA_MAP_REQUEST');const live=document.getElementById('map-live');if(live&&!zenviaMap.data)live.textContent='CONNECTING TO AKWANTUO'}
function initZenviaMap(){
 const canvas=document.getElementById('zenvia-map-canvas');if(!canvas)return;
 zenviaMap.canvas=canvas;zenviaMap.ctx=canvas.getContext('2d');
 const stage=canvas.parentElement;
 const resize=()=>{const rect=canvas.getBoundingClientRect();if(!rect.width||!rect.height)return;const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);zenviaMap.ctx.setTransform(dpr,0,0,dpr,0,0);drawZenviaMap()};
 if(window.ResizeObserver){if(!zenviaMap.observer){zenviaMap.observer=new ResizeObserver(resize)}zenviaMap.observer.disconnect();zenviaMap.observer.observe(stage)}else window.addEventListener('resize',resize);
 document.getElementById('map-zoom-in').onclick=()=>{zenviaMap.zoom=Math.min(6,zenviaMap.zoom*1.35);drawZenviaMap()};
 document.getElementById('map-zoom-out').onclick=()=>{zenviaMap.zoom=Math.max(1,zenviaMap.zoom/1.35);drawZenviaMap()};
 document.getElementById('map-locate').onclick=()=>{if(!zenviaMap.data||!zenviaMap.state)return;const e=zenviaMap.data.extent,r=canvas.getBoundingClientRect(),cx=(e.minX+e.maxX)/2,cz=(e.minZ+e.maxZ)/2;zenviaMap.zoom=Math.max(2,zenviaMap.zoom);const z=getZenviaMapBaseScale(r.width,r.height,e)*zenviaMap.zoom;zenviaMap.panX=(cx-zenviaMap.state.x)*z;zenviaMap.panY=(zenviaMap.state.z+cz)*z;drawZenviaMap()};
 canvas.onpointerdown=e=>{zenviaMap.drag={id:e.pointerId,x:e.clientX,y:e.clientY,panX:zenviaMap.panX,panY:zenviaMap.panY};canvas.setPointerCapture(e.pointerId)};
 canvas.onpointermove=e=>{if(!zenviaMap.drag||zenviaMap.drag.id!==e.pointerId)return;zenviaMap.panX=zenviaMap.drag.panX+e.clientX-zenviaMap.drag.x;zenviaMap.panY=zenviaMap.drag.panY+e.clientY-zenviaMap.drag.y;drawZenviaMap()};
 const endDrag=e=>{if(zenviaMap.drag&&zenviaMap.drag.id===e.pointerId)zenviaMap.drag=null};canvas.onpointerup=endDrag;canvas.onpointercancel=endDrag;canvas.onlostpointercapture=endDrag;
 requestZenviaMap();if(zenviaMap.retry)clearInterval(zenviaMap.retry);zenviaMap.retry=setInterval(()=>{if(!zenviaMap.data)requestZenviaMap();else{clearInterval(zenviaMap.retry);zenviaMap.retry=null}},1400);
 resize();
}
function getZenviaMapBaseScale(w,h,e){const fit=Math.min((w-24)/e.widthM,(h-24)/e.depthM);return h>w?Math.max(fit,(h-104)/e.depthM):fit}
function drawZenviaMap(){
 const c=zenviaMap.canvas,ctx=zenviaMap.ctx,data=zenviaMap.data;if(!c||!ctx)return;
 const rect=c.getBoundingClientRect(),w=rect.width,h=rect.height;if(!w||!h)return;
 ctx.clearRect(0,0,w,h);ctx.fillStyle='#10252b';ctx.fillRect(0,0,w,h);
 if(!data){ctx.fillStyle='#b6c4c5';ctx.font='12px system-ui';ctx.textAlign='center';ctx.fillText('Connecting to the AKWANTUO world…',w/2,h/2);return}
 const e=data.extent,cx=(e.minX+e.maxX)/2,cz=(e.minZ+e.maxZ)/2,scale=getZenviaMapBaseScale(w,h,e)*zenviaMap.zoom;
 const ox=w/2+zenviaMap.panX-cx*scale,oy=h/2+zenviaMap.panY+cz*scale;
 const point=(x,z)=>({x:ox+x*scale,y:oy-z*scale});
 ctx.save();ctx.beginPath();ctx.rect(0,0,w,h);ctx.clip();
 const coast=data.coastline||[];if(coast.length>1){ctx.beginPath();coast.forEach((p,i)=>{const q=point(p.x,p.z);if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)});const end=point(e.maxX,e.minZ),start=point(e.minX,e.minZ);ctx.lineTo(end.x,end.y);ctx.lineTo(start.x,start.y);ctx.closePath();ctx.fillStyle='#17414b';ctx.fill();ctx.strokeStyle='#4e8790';ctx.lineWidth=1.5;ctx.stroke()}
 if(zenviaMap.zoom>=1.35){ctx.fillStyle='#33463e';for(const b of data.buildings||[]){const p=point(b.x,b.z);if(p.x<-20||p.x>w+20||p.y<-20||p.y>h+20)continue;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-(b.yaw||0)*Math.PI/180);ctx.fillRect(-b.hx*scale,-b.hz*scale,b.hx*2*scale,b.hz*2*scale);ctx.restore()}}
 for(const road of data.roads||[]){if(!road.points||road.points.length<2)continue;ctx.beginPath();road.points.forEach((p,i)=>{const q=point(p.x,p.z);if(i===0)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)});const highway=/^(n1|n4|n6)-/.test(road.id||'');ctx.strokeStyle=highway?'#d2b477':'#a6b5a9';ctx.lineWidth=Math.max(highway?2.1:1.1,scale*(highway?17:8));ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke()}
 const labelCandidates=[];
 for(const place of data.landmarks||[]){const p=point(place.x,place.z);if(p.x<-30||p.x>w+30||p.y<-30||p.y>h+30)continue;if(zenviaMap.zoom>1.05){const a=point(place.minX,place.maxZ),b=point(place.maxX,place.minZ);ctx.fillStyle='#c6a66a33';ctx.strokeStyle='#e2bd7b';ctx.lineWidth=1;ctx.fillRect(a.x,a.y,b.x-a.x,b.y-a.y);ctx.strokeRect(a.x,a.y,b.x-a.x,b.y-a.y)}ctx.beginPath();ctx.arc(p.x,p.y,Math.max(2.5,3.5*zenviaMap.zoom/2),0,Math.PI*2);ctx.fillStyle='#f0c477';ctx.fill();if(zenviaMap.zoom>=1.6&&place.label)labelCandidates.push({text:String(place.label),x:p.x+7,y:p.y-7,priority:80,align:'left',kind:'landmark'});}
 const majorAreas=new Set(['accra-central-makola','tema','madina-adenta','dansoman']);
 const detailedAreas=new Set(['osu','labadi','kaneshie','spintex']);
 const areaNames={'accra-central-makola':'Accra Central','tema':'Tema','madina-adenta':zenviaMap.zoom<1.65?'Madina':'Madina · Adenta','dansoman':'Dansoman','osu':'Osu','labadi':'Labadi','kaneshie':'Kaneshie','spintex':'Spintex'};
 const visibleRegions=(data.regions||[]).filter(region=>{const id=String(region.id||'').toLowerCase();return majorAreas.has(id)||(zenviaMap.zoom>=1.65&&detailedAreas.has(id))});
 for(const region of visibleRegions){const p=point(region.x,region.z);const id=String(region.id||'').toLowerCase(),label=areaNames[id]||String(region.label||'');if(label)labelCandidates.push({text:label,x:p.x,y:p.y-8,priority:100,align:'center',kind:'region'});}
 // One screen-space declutter pass for every label type. Text stays fixed-size as the map zooms.
 const safeTop=zenviaMap.zoom>=1.6?62:54,safeBottom=zenviaMap.zoom>=1.6?78:66,occupied=[];
 labelCandidates.sort((a,b)=>b.priority-a.priority);
 for(const item of labelCandidates){
   ctx.font=item.kind==='region'?'700 10px system-ui':'600 10px system-ui';
   const padX=7,padY=4,textWidth=ctx.measureText(item.text).width;
   const left=item.align==='center'?item.x-textWidth/2-padX:item.x;
   const right=item.align==='center'?item.x+textWidth/2+padX:item.x+textWidth+padX*2;
   const box={l:left,r:right,t:item.y-10-padY,b:item.y+4+padY};
   if(box.r<5||box.l>w-5||box.b<safeTop||box.t>h-safeBottom)continue;
   if(occupied.some(a=>box.l<a.r+6&&box.r>a.l-6&&box.t<a.b+4&&box.b>a.t-4))continue;
   occupied.push(box);
   ctx.save();ctx.font=item.kind==='region'?'700 10px system-ui':'600 10px system-ui';ctx.textAlign=item.align==='center'?'center':'left';ctx.textBaseline='middle';
   ctx.fillStyle=item.kind==='region'?'#b7c9c0':'#f5eee0';
   ctx.shadowColor='#071116';ctx.shadowBlur=4;ctx.fillText(item.text,item.x,item.y);ctx.restore();
 }
 if(zenviaMap.state){const p=point(zenviaMap.state.x,zenviaMap.state.z),angle=(zenviaMap.state.heading||0)*Math.PI/180;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(-angle);ctx.beginPath();ctx.moveTo(0,-11);ctx.lineTo(7,8);ctx.lineTo(0,4);ctx.lineTo(-7,8);ctx.closePath();ctx.fillStyle=zenviaMap.state.inVehicle?'#77d5a8':'#f5d18a';ctx.strokeStyle='#102027';ctx.lineWidth=2;ctx.fill();ctx.stroke();ctx.restore();ctx.beginPath();ctx.arc(p.x,p.y,13,0,Math.PI*2);ctx.strokeStyle='#f5d18a88';ctx.lineWidth=1;ctx.stroke()}
 ctx.restore();
 const live=document.getElementById('map-live'),status=document.getElementById('map-status'),coord=document.getElementById('map-coordinate'),district=document.getElementById('map-district');
 if(live){live.textContent=zenviaMap.state?'LIVE · AKWANTUO WORLD':'WORLD MAP LOADED';live.classList.toggle('connected',!!zenviaMap.state)}
 if(status)status.textContent=zenviaMap.state?(zenviaMap.state.inVehicle?'PLAYER · IN VEHICLE':'PLAYER · ON FOOT'):'Waiting for player position';
 if(coord&&zenviaMap.state)coord.textContent='X '+Math.round(zenviaMap.state.x)+' · Z '+Math.round(zenviaMap.state.z);
 if(district&&zenviaMap.state&&data.regions&&data.regions.length){const near=data.regions.reduce((a,b)=>Math.hypot(b.x-zenviaMap.state.x,b.z-zenviaMap.state.z)<Math.hypot(a.x-zenviaMap.state.x,a.z-zenviaMap.state.z)?b:a);district.textContent=near.label+' · GREATER ACCRA'}
}
window.addEventListener('message',event=>{if(event.source!==window.parent||event.origin!==window.location.origin)return;const m=event.data||{};if(m.type==='ZENVIA_MAP_STATIC'){zenviaMap.data=m.payload;if(zenviaMap.retry){clearInterval(zenviaMap.retry);zenviaMap.retry=null}drawZenviaMap()}else if(m.type==='ZENVIA_MAP_STATE'){zenviaMap.state=m.payload;drawZenviaMap()}else if(m.type==='ZENVIA_MAP_PARENT_CLOSED'){sendMapMessage('ZENVIA_MAP_CLOSE')}});

document.getElementById('phone-close').addEventListener('click',()=>{if(window.parent!==window)window.parent.postMessage({type:'ZENVIA_TABLET_CLOSE'},window.location.origin)});
document.querySelectorAll('[data-app]').forEach(el=>el.addEventListener('click',()=>openApp(el.dataset.app)));
document.querySelectorAll('[data-toast]').forEach(el=>el.addEventListener('click',()=>showToast(el.dataset.toast)));
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(window._atlasToast);window._atlasToast=setTimeout(()=>toast.classList.remove('show'),1700)}
const device=document.getElementById('atlas-device'),lockScreen=document.getElementById('lock-screen');
function unlock(){device.classList.remove('is-locked')}
function lock(){goHome();device.classList.add('is-locked')}
document.getElementById('unlock-button').addEventListener('click',unlock);
let touchStartY=null;
lockScreen.addEventListener('touchstart',e=>{touchStartY=e.touches[0].clientY},{passive:true});
lockScreen.addEventListener('touchend',e=>{if(touchStartY!==null&&touchStartY-e.changedTouches[0].clientY>35)unlock();touchStartY=null},{passive:true});
lockScreen.addEventListener('click',e=>{if(e.target.closest('button'))return;unlock()});
function tick(){const d=new Date(),time=d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',hour12:false});document.getElementById('status-clock').textContent=time;document.getElementById('lock-time').textContent=time;document.getElementById('lock-date').textContent=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'});const homeDate=document.getElementById('home-date');if(homeDate)homeDate.textContent=d.toLocaleDateString([], {weekday:'long',month:'long',day:'numeric'})}
tick();setInterval(tick,1000);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(device.classList.contains('is-locked'))unlock();else goHome()}});
</script>
</body></html>
