<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elara Phone Prototype</title>
<style>
:root{--bg:#eef0f4;--fg:#111827;--mut:#6b7280;--chip:#fff;--line:#d5d9e1;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07090e;--fg:#e8ecf4;--mut:#98a1b2;--chip:#141922;--line:#2a313e}}
:root[data-theme="dark"]{--bg:#07090e;--fg:#e8ecf4;--mut:#98a1b2;--chip:#141922;--line:#2a313e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px}
.sw{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.sw button{border:1px solid var(--line);background:var(--chip);color:var(--fg);padding:8px 14px;border-radius:20px;font-size:14px;cursor:pointer}
.sw button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.info{font-size:13px;color:var(--mut);text-align:center;max-width:340px;line-height:1.5}
.ph{width:340px;max-width:100%;height:640px;border-radius:46px;background:#02030a;padding:10px;border:1px solid var(--line)}
#scr{position:relative;width:100%;height:100%;border-radius:37px;overflow:hidden;background:#0B0F1A;color:#E8ECF4;user-select:none;font-size:14px}
.sb{position:absolute;top:0;left:0;right:0;height:38px;display:flex;cursor:pointer;justify-content:space-between;align-items:center;padding:6px 24px 0;font-size:12px;z-index:3}
.lock{position:absolute;inset:0;background:radial-gradient(circle at 72% 18%,#27345a,#0B0F1A 62%);display:flex;flex-direction:column;align-items:center;cursor:pointer}
.lt{margin-top:96px;font-size:76px;font-weight:200;letter-spacing:2px}
.ld{margin-top:4px;color:#aab4c8;font-size:15px}
.ring{margin-top:70px;width:92px;height:92px;border-radius:50%;border:5px solid #E8ECF4;position:relative;opacity:.9}
.ring:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#E8ECF4;top:4px;right:6px}
.hint{position:absolute;bottom:44px;color:#aab4c8;font-size:13px}
.barw{position:absolute;bottom:0;left:0;right:0;height:30px;display:flex;align-items:center;justify-content:center;z-index:4;cursor:pointer}
.bar{width:120px;height:5px;border-radius:3px;background:#E8ECF4;opacity:.8}
.home{position:absolute;inset:0;padding:56px 18px 40px;background:radial-gradient(circle at 20% 0%,#1d2744,#0B0F1A 58%);overflow:auto}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 6px}
.ic{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;font-size:11px;text-align:center}
.ic i,.card i{font-style:normal;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:500;color:#fff}
.app{position:absolute;inset:0;padding-top:38px;background:#0B0F1A;display:flex;flex-direction:column}
.hd{display:flex;justify-content:space-between;align-items:center;padding:8px 18px;font-size:16px}
.hd b{font-weight:500;color:#9DB4FF;cursor:pointer;min-width:70px}.hd em{min-width:70px}
.bd{flex:1;overflow:auto;padding:6px 18px 40px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #1c2333}
.row i{font-style:normal;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:500}
.row div{flex:1;min-width:0}.row small,.mut{color:#8d97ab;font-size:12px}
.btn{border:0;border-radius:16px;padding:7px 16px;background:#E8ECF4;color:#0B0F1A;font-size:13px;font-weight:500;cursor:pointer}
.big{width:100%;margin-top:12px;border:0;border-radius:26px;padding:13px;font-size:16px;color:#fff;cursor:pointer}
.grn{background:#2f9e5b}.red{background:#d24b4b}
.prog{width:70px;height:6px;border-radius:3px;background:#222a3b;overflow:hidden}.prog u{display:block;height:100%;background:#9DB4FF}
.disp{font-size:30px;text-align:center;min-height:44px;margin:8px 0;letter-spacing:2px}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pad button{height:52px;border:0;border-radius:50%;background:#1a2133;color:#E8ECF4;font-size:20px;cursor:pointer}
.bal{font-size:38px;font-weight:300;margin:10px 0 14px}
.bub{max-width:78%;padding:8px 12px;border-radius:16px;margin:6px 0;background:#1a2133}
.bub.me{margin-left:auto;background:#3a5bd6}
.msgin{display:flex;gap:8px;margin-top:12px}.msgin input{flex:1;border:1px solid #2a3348;background:#121828;color:#E8ECF4;border-radius:18px;padding:9px 12px;font-size:14px}
.flow{position:absolute;inset:0;background:rgba(5,7,14,.94);padding:60px 0 50px;display:flex;flex-direction:column;align-items:center;z-index:2}
.cards{display:flex;gap:14px;overflow-x:auto;width:100%;padding:24px 22px;flex:1;align-items:center}
.card{flex:0 0 150px;height:250px;border-radius:22px;background:#161d2e;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:pointer}
.toast{position:absolute;left:18px;right:18px;bottom:46px;background:#E8ECF4;color:#0B0F1A;padding:10px 14px;border-radius:14px;font-size:13px;text-align:center;z-index:6}
.su{position:absolute;inset:0;padding:64px 22px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;background:radial-gradient(circle at 72% 18%,#27345a,#0B0F1A 62%);overflow:auto}.su h2{margin:0;font-weight:400;font-size:22px}.su .ring{margin:6px 0}.su .pad{width:100%}.su input{width:100%;border:1px solid #2a3348;background:#121828;color:#E8ECF4;border-radius:14px;padding:12px;font-size:15px}.dots{font-size:22px;letter-spacing:12px;min-height:32px;text-align:center}.map{width:100%;border-radius:14px;display:block;margin-bottom:8px}
.fld{width:100%;border:1px solid #2a3348;background:#121828;color:#E8ECF4;border-radius:14px;padding:11px;font-size:14px;margin-bottom:8px}.vf{height:290px;border-radius:14px;overflow:hidden}.vf svg,.tn svg{width:100%;height:100%;display:block}.tn{height:92px;border-radius:10px;overflow:hidden;cursor:pointer}.wpi{position:absolute;inset:0;z-index:-1}
.shade{position:absolute;inset:0;z-index:12;background:rgba(8,12,22,.97);padding:48px 16px 24px;overflow:auto;color:#e8ecf4;backdrop-filter:blur(18px)}
.shade h2{font-size:26px;font-weight:400;margin:8px 0 4px}.shadegrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin:18px 0}.qst{border:1px solid #30394d;background:#182237;color:#e8ecf4;border-radius:16px;padding:13px;text-align:left;min-height:62px;font-size:13px}.qst.on{background:#4565bd;border-color:#7895e8}.qst b{display:block;font-size:15px;margin-bottom:4px}.shadecard{border:1px solid #30394d;background:#131c2d;border-radius:15px;padding:12px;margin:9px 0;font-size:13px}.shadehead{display:flex;align-items:center;justify-content:space-between}.shadehead button{border:0;background:transparent;color:#9db4ff;font-size:13px}.shadefoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;color:#9aa7bf;font-size:12px}.home,.lock{isolation:isolate}
</style><style>
/* Embedded Elara device layout: fit the original prototype inside the game overlay. */
html,body{width:100%;height:100%;min-height:0;overflow:hidden}
body{padding:8px;gap:8px;justify-content:center;overflow:hidden}
.ph{width:min(340px,100%);height:min(640px,calc(100dvh - 100px));min-height:420px}
.info{display:none}
@media(max-height:560px){.ph{height:calc(100dvh - 64px);min-height:0;border-radius:26px}.sw button{padding:6px 10px;font-size:12px}}
</style></head>
<body>
<div class="sw" id="sw"></div>
<div class="ph"><div id="scr"></div></div>
<div class="info" id="info"></div>
<script>
const M={go:{n:"Elara Go",net:"3G",bat:"8h battery",free:320,sp:25,price:600},el:{n:"Elara",net:"4G",bat:"16h battery",free:1500,sp:60,price:2200},pr:{n:"Elara Prime",net:"5G",bat:"30h battery",free:6000,sp:150,price:6500}};
const BASE=[["calls","Phone","#2f9e5b"],["msg","Messages","#25a244"],["pay","Sika Pay","#b8892b"],["maps","Waka Maps","#c24b4b"],["taxi","Ride","#d9a400"],["music","Jama","#c23b72"],["trade","Market","#0f8f7d"],["bm","Underground","#3b3f4a"],["cam","Camera","#7a5af8"],["store","App Store","#4a5568"],["set","Settings","#6b7280"]];
const CAT=[["jobs","Jobs",0,40,"#0f8f7d","Work"],["ride","Trotro",0,80,"#d9781c","Travel"],["food","Chop Bar",0,70,"#e0572b","Food"],["shop","Shopping",0,90,"#b5446e","Shopping"],["feed","Community",0,150,"#7c4ddb","Social"],["chat","Chat",0,95,"#2a9d8f","Social"],["tunes","Hiplife",15,120,"#c23b72","Music"],["reel","Kumawood",25,400,"#8a2be2","Video"],["news","News",0,35,"#4a6fa5","News"],["sky","Weather",0,25,"#3a8fd1","Weather"],["fit","Fitness",0,55,"#3f9c5a","Health"],["learn","Learning",0,110,"#c28a1f","Education"],["note","Notes",5,20,"#6b7280","Tools"],["word","Ananse Words",0,45,"#d4572a","Games"],["block","Ampe Run",8,220,"#5b5bd6","Games"],["race","Kwahu Rally",20,300,"#c0392b","Games"]];
const TH=[["Ama (Landlord)","Rent is due on Friday."],["Kofi (Boss)","Your shift starts at 8am tomorrow."],["Mum","Call me when you are free."]];
const $=s=>document.querySelector(s);
let k="el",bal,free,inst,scr,app,rec,pay,th,call,calling,msgs,prog,tmsg,y0=0,changingPasscode=false;
let simState={network:"MTN",number:"0241234567",airtime:25,dataMB:0,minutes:0,bundles:[]},ussdScreen=null;
let callSeconds=0,callMinuteCharged=0,lastUsageToast=0,streamSeconds=0;
const DATA_COST={news:0.6,sky:0.2,feed:1.5,chat:0.4,jobs:0.8,shop:1.2,trade:0.8,maps:0.25,taxi:0.35,learn:1.0,store:0.5};
function useMobileData(mb,reason){mb=Math.max(0,Number(mb)||0);if(!mb)return true;if(simState.dataMB+0.0001<mb){if(Date.now()-lastUsageToast>1800){lastUsageToast=Date.now();toast(`Not enough data for ${reason}. Buy a bundle or connect to Wi-Fi.`)}return false}simState.dataMB=Math.max(0,Math.round((simState.dataMB-mb)*1000)/1000);savePhoneState();return true}
function useCallMinute(){if(simState.minutes>0){simState.minutes=Math.max(0,simState.minutes-1);savePhoneState();return true}const cost=0.2;if(simState.airtime<cost){calling=false;toast('Your voice minutes and airtime are finished.');return false}simState.airtime=Math.round((simState.airtime-cost)*100)/100;savePhoneState();return true}
function networkedApp(id){return Object.prototype.hasOwnProperty.call(DATA_COST,id)||['music','reel'].includes(id)}
function reset(){simState={network:"MTN",number:"0241234567",airtime:25,dataMB:0,minutes:0,bundles:[]};ussdScreen=null;bal=2500;free=M[k].free;inst=[];scr=me?"lock":"setup";app=null;sub="";pin="";sel=null;ph=[];gi=null;bat=100;bf=100;typ=-1;rec=[];pay=[];th=null;call="";calling=0;callSeconds=0;callMinuteCharged=0;streamSeconds=0;msgs={};prog={};tmsg=""}
const tm=()=>new Date().toTimeString().slice(0,5);
const dt=()=>new Date().toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
function meta(id){return BASE.find(x=>x[0]==id)||(c=>[c[0],c[1],c[4]])(CAT.find(x=>x[0]==id))}
function toast(m){tmsg=m;render();setTimeout(()=>{if(tmsg==m){tmsg="";render()}},2200)}
function open(id){if(app==='calls'&&calling){calling=false;callSeconds=0;callMinuteCharged=0}streamSeconds=0;if(networkedApp(id)&&!useMobileData(DATA_COST[id]??(id==='music'?0.4:1.2),meta(id)[1]))return;app=id;scr="app";rec=[id,...rec.filter(x=>x!=id)].slice(0,5);if(id!="msg")th=null;if(id==='calls'){callSeconds=0;callMinuteCharged=0}render()}
function get(id){const c=CAT.find(x=>x[0]==id);if(inst.includes(id)||prog[id]!=null)return;
 if(c[2]>bal)return toast("Not enough balance in Elara Pay.");
 if(c[3]>free)return toast("Storage full. Delete an app or upgrade your phone.");
 if(!useMobileData(Math.max(1,c[3]*0.08),`downloading ${c[1]}`))return;
 bal-=c[2];free-=c[3];if(c[2])pay.unshift("Bought "+c[1]+" -GH₵ "+c[2]);
 prog[id]=0;const t=c[3]/M[k].sp*1000,s=Date.now(),kk=k;
 const iv=setInterval(()=>{if(kk!=k)return clearInterval(iv);const p=Math.min(1,(Date.now()-s)/t);prog[id]=p;
  if(p>=1){clearInterval(iv);delete prog[id];inst.push(id);tmsg=c[1]+" installed."}render()},100)}
function body(){
 if(app=="store"){return `<p class="mut">Free space: ${free} MB · Download speed: ${M[k].net}</p>`+CAT.map(c=>{
  const done=inst.includes(c[0]),p=prog[c[0]];
  const act=done?`<button class="btn" data-o="${c[0]}">Open</button>`:p!=null?`<div class="prog"><u style="width:${p*100}%"></u></div>`:`<button class="btn" data-i="${c[0]}">${c[2]?"GH₵ "+c[2]:"Get"}</button>`;
  return `<div class="row"><i style="background:${c[4]}">${c[1][0]}</i><div>${c[1]}<br><small>${c[5]} · ${c[3]} MB · ${c[2]?"GH₵ "+c[2]:"Free"}</small></div>${act}</div>`}).join("")}
 if(app=="pay")return `<div class="mut">Balance</div><div class="bal">GH₵ ${bal.toLocaleString()}</div><button class="btn" data-a="p50">Send GH₵ 50 to Ama</button> <button class="btn" data-a="air">Buy GH₵ 10 airtime</button><p class="mut">Activity</p>${pay.length?pay.map(x=>`<div class="row">${esc(x)}</div>`).join(""):'<p class="mut">No activity yet. Send money or buy an app to see it here.</p>'}`+payP();
 if(app=="calls"&&ussdScreen)return ussdView();if(app=="calls"&&ct)return conV();if(app=="calls")return `<div class="shadecard"><b>SIM & network</b><select class="fld" id="simNetwork"><option ${simState.network==='MTN'?'selected':''}>MTN</option><option ${simState.network==='Telecel'?'selected':''}>Telecel</option><option ${simState.network==='AT'?'selected':''}>AT</option></select><small class="mut">${simState.number} · Airtime GH₵ ${simState.airtime.toFixed(2)} · ${formatData(simState.dataMB)} · ${simState.minutes} mins</small><div class="mut" style="margin-top:5px">Online apps, downloads, streaming and calls use your SIM allowance. Voice bundles are used before airtime.</div></div>`+tabsV()+`<div class="disp">${esc(call||"Enter number")}</div><div class="pad">${"123456789*0#".split("").map(d=>`<button data-d="${d}">${d}</button>`).join("")}</div><button class="big ${calling?"red":"grn"}" data-a="call">${calling?"End call":"Call"}</button>${calling?'<p class="mut" style="text-align:center">Calling…</p>':""}`;
 if(app=="msg")return chaleV();if(0){if(th==null)return TH.map((t,i)=>`<div class="row" data-t="${i}" style="cursor:pointer"><i style="background:#3a5bd6">${t[0][0]}</i><div>${t[0]}<br><small>${t[1]}</small></div></div>`).join("");
  const m=[{m:TH[th][1]},...(msgs[th]||[])];return m.map(x=>`<div class="bub ${x.me?"me":""}">${esc(x.m)}</div>`).join("")+`<div class="msgin"><input id="mi" placeholder="Message"><button class="btn" data-a="send">Send</button></div>`}
 if(app=="maps")return mapV();if(app=="taxi")return taxiV();if(app=="music")return musicV();if(app=="set")return setV();if(app=="trade")return tradeV();if(app=="bm")return bmV();if(app=="cam")return camV();if(0)return `<p class="mut">This app arrives in the next build.</p>`;
 return `<p class="mut">${meta(app)[1]} is installed. Its screens arrive in the next build.</p>`}
function render(){let h="";
 if(scr=="setup")h=setupV();else if(scr=="pass")h=passV();else if(scr=="dead")h=deadV();else if(scr=="lock")h=`<div class="lock" id="lk">${wpH(wl)}<div class="lt">${tm()}</div><div class="ld">${dt()}</div><div class="ring"></div><div class="hint">Swipe up to unlock</div></div><div class="barw"><div class="bar"></div></div>`;
 else{h=`<div class="sb" data-x="shade"><b>${tm()}</b><span>${M[k].net} · <b id="bt">${bat}</b>% ▾</span></div>`;
  if(scr=="home")h+=`<div class="home">${wpH(wh)}<div class="grid">${[...BASE.map(x=>x[0]),...inst].map(id=>{const a=meta(id);return `<div class="ic" data-o="${id}"><i style="background:${a[2]}">${a[1][0]}</i><span>${a[1]}</span></div>`}).join("")}</div></div>`;
  else if(scr=="app")h+=`<div class="app"><div class="hd"><b data-a="home">‹ Home</b><span>${meta(app)[1]}</span><em></em></div><div class="bd">${body()}</div></div>`;
  else h+=`<div class="flow"><span class="mut">Flow</span><div class="cards">${rec.length?rec.map(id=>{const a=meta(id);return `<div class="card" data-o="${id}"><i style="background:${a[2]}">${a[1][0]}</i>${a[1]}</div>`}).join(""):'<span class="mut">No recent apps. Open one from Home.</span>'}</div><button class="btn" data-a="home">Home</button></div>`;
  h+=`<div class="barw" data-bar><div class="bar"></div></div>`}
 if(tmsg)h+=`<div class="toast">${esc(tmsg)}</div>`;
 $("#scr").innerHTML=h;
 $("#sw").innerHTML=Object.keys(M).map(x=>`<button class="${x==k?"on":""}" data-k="${x}">${M[x].n}</button>`).join("");
 $("#info").textContent=`${M[k].n} · GH₵ ${M[k].price.toLocaleString()} · ${M[k].net} · ${M[k].bat}. Tap the bar at the bottom to open Flow.`}
function ussdResponse(code){const n=simState.network;if((n==='MTN'&&code==='*124#')||(n==='Telecel'&&['*124#','*126#'].includes(code))||(n==='AT'&&code==='*504#'))return {title:n+' balance',body:`Main airtime: GH₵ ${simState.airtime.toFixed(2)}\nData remaining: ${formatData(simState.dataMB)}\nVoice minutes: ${simState.minutes} mins\nNumber: ${simState.number}\n\nActive bundles:\n${simState.bundles.length?simState.bundles.slice(0,5).map(b=>`${b.name}: ${formatData(b.dataMB)} · ${b.minutes} mins · expires ${new Date(b.expires).toLocaleDateString()}`).join('\n'):'No active bundles'}`,code};if((n==='MTN'&&code==='*138#')||(n==='Telecel'&&['*700#','*200#','*110#'].includes(code))||(n==='AT'&&['*111#','*110#','*567#'].includes(code)))return {title:n+' services',body:`1. Buy data bundle\n2. Buy voice bundle\n3. Buy airtime\n4. Check bundle balance\n\nChoose services in Sika Pay to complete a simulated purchase.`,code};if(n==='AT'&&code==='*111*4#')return {title:'AT data bundles',body:'Sika Kokoo & other data bundles\nChoose a bundle in Sika Pay.',code};return {title:'USSD code not recognised',body:`${code} is not available for ${n} in this Elara simulation. Check the network menu or select the correct SIM network.`,code}}
function formatData(mb){if(mb>=1024)return (mb/1024).toFixed(mb%1024?2:0)+' GB';return Math.round(mb)+' MB'}
function ussdView(){return `<div class="shadecard"><b>${bankEsc(ussdScreen.title)}</b><p style="white-space:pre-line;line-height:1.6">${bankEsc(ussdScreen.body)}</p><small class="mut">${bankEsc(ussdScreen.code)} · SIM network: ${bankEsc(simState.network)}</small></div><button class="big grn" data-x="ussd_done">Close</button><button class="btn" data-x="ussd_buy">Buy bundles in Sika Pay</button>`}
document.addEventListener("click",e=>{const t=e.target.closest("[data-k],[data-o],[data-i],[data-a],[data-d],[data-t],[data-bar],[data-x],#lk");if(!t)return;
 const d=t.dataset;if(d.x)return X(d.x);
 if(d.k){k=d.k;reset();return render()}
 if(t.id=="lk"){scr=hasPasscode()?"pass":"home";return render()}
 if(d.bar!=null){scr=scr=="app"?"flow":scr=="flow"?"home":"home";return render()}
 if(d.o){return open(d.o)}
 if(d.i)return get(d.i);
 if(d.d){if(call.length<12)call+=d.d;return render()}
 if(d.t){th=+d.t;return render()}
 if(d.a=="home"){scr="home";return render()}
 if(d.a==="call"){if(/^\*[0-9*]+#$/.test(call)){ussdScreen=ussdResponse(call);calling=false;return render()}calling=!calling;if(calling&&!call)call="0302 000 000";if(!calling){callSeconds=0;callMinuteCharged=0}return render()}
 if(d.a=="p50"){if(bal<50)return toast("Not enough balance.");bal-=50;pay.unshift("Sent to Ama -GH₵ 50");return render()}
 if(d.a=="air"){if(bal<10)return toast("Not enough balance.");bal-=10;pay.unshift("Airtime -GH₵ 10");return render()}
 if(d.a=="send"){const i=$("#mi"),v=i.value.trim();if(!v)return toast("Type a message first.");(msgs[th]=msgs[th]||[]).push({m:v,me:1});render();setTimeout(()=>{msgs[th].push({m:"Received, thank you."});if(app=="msg"&&scr=="app")render()},800)}});
document.addEventListener("change",e=>{if(e.target?.id==='simNetwork'){simState.network=e.target.value;savePhoneState();render()}if(e.target?.id==='svcValue'){const p=(e.target.value||'').split('|');const amount=$('#svcAmount');if(amount&&p[1])amount.value=p[1];const product=$('#svcProduct');if(product){product.value=(Number(p[2])>0?'Data bundle':Number(p[3])>0?'Call minutes':'Airtime')}}if(e.target?.id==='svcProvider'){simState.network=e.target.value;}});

// Local device persistence. Passcodes are stored only as salted PBKDF2 hashes; temporary session/UI state is excluded.
const ELARA_STORE='elara-phone-state-v1';
function savePhoneState(){
 try{
  const state={v:1,k,me,bal,free,inst,rec,pay,msgs,ph,wh,wl,quick,notices,CT,mynum,pm,heat,bag,hold,px,rt,wt,ft,cs,cmt,inc,passHash,passSalt,notesData,jobsSaved,jobsApplied,bankTransactions,simState};
  localStorage.setItem(ELARA_STORE,JSON.stringify(state));
 }catch(e){
  // Photos can exceed browser storage quotas; keep the rest of the phone usable.
  try{const state={v:1,k,me,bal,free,inst,rec,pay,msgs,wh,wl,quick,notices,CT,mynum,pm,heat,bag,hold,px,rt,wt,ft,cs,cmt,inc,passHash,passSalt,notesData,jobsSaved,jobsApplied,bankTransactions,simState};localStorage.setItem(ELARA_STORE,JSON.stringify(state));}
  catch(_){tmsg='Device storage is full. Some recent changes may not be saved.';}
 }
}
function restorePhoneState(){
 try{
  const raw=localStorage.getItem(ELARA_STORE);if(!raw)return;
  const s=JSON.parse(raw);if(!s||s.v!==1)return;
  if(s.k&&M[s.k])k=s.k;
  if(s.me&&typeof s.me.n==='string'&&typeof s.me.h==='string')me={n:s.me.n.slice(0,40),h:s.me.h.replace(/[^A-Za-z0-9_]/g,'').slice(0,15)};
  if(Number.isFinite(s.bal))bal=Math.max(0,Math.min(1000000000,s.bal));
  if(Number.isFinite(s.free))free=Math.max(0,Math.min(M[k].free,s.free));
  if(Array.isArray(s.inst))inst=s.inst.filter(id=>id!=='bank'&&CAT.some(c=>c[0]===id));
  if(Array.isArray(s.rec))rec=s.rec.filter(id=>id!=='bank'&&(BASE.some(a=>a[0]===id)||CAT.some(a=>a[0]===id))).slice(0,5);
  if(Array.isArray(s.pay))pay=s.pay.filter(x=>typeof x==='string').slice(0,100);
  if(Array.isArray(s.jobsSaved))jobsSaved=s.jobsSaved.filter(id=>JOB_DEMO.some(j=>j.id===id)).slice(0,100);
  if(Array.isArray(s.jobsApplied))jobsApplied=s.jobsApplied.filter(id=>JOB_DEMO.some(j=>j.id===id)).slice(0,100);
  if(Array.isArray(s.bankTransactions))bankTransactions=s.bankTransactions.filter(t=>t&&typeof t.id==='string'&&typeof t.title==='string'&&Number.isFinite(t.amount)&&['debit','credit'].includes(t.direction)&&typeof t.createdAt==='string').slice(0,300).map(t=>({...t,id:t.id.slice(0,40),title:t.title.slice(0,100),amount:Math.max(0,Math.min(1000000,t.amount)),recipient:typeof t.recipient==='string'?t.recipient.slice(0,80):'',destination:typeof t.destination==='string'?t.destination.slice(0,80):'',note:typeof t.note==='string'?t.note.slice(0,100):'',status:'Completed'}));
  if(s.simState&&typeof s.simState==='object'){const q=s.simState;simState={network:['MTN','Telecel','AT'].includes(q.network)?q.network:'MTN',number:typeof q.number==='string'&&/^(?:0\d{9}|\+233\d{9})$/.test(q.number)?q.number:'0241234567',airtime:Number.isFinite(q.airtime)?Math.max(0,Math.min(100000,q.airtime)):25,dataMB:Number.isFinite(q.dataMB)?Math.max(0,Math.min(100000000,q.dataMB)):0,minutes:Number.isFinite(q.minutes)?Math.max(0,Math.min(100000,q.minutes)):0,bundles:Array.isArray(q.bundles)?q.bundles.slice(0,50).filter(b=>b&&typeof b.name==='string').map(b=>({name:b.name.slice(0,80),dataMB:Math.max(0,Number(b.dataMB)||0),minutes:Math.max(0,Number(b.minutes)||0),expires:typeof b.expires==='string'?b.expires.slice(0,40):''})):[]};}
  if(Array.isArray(s.notesData))notesData=s.notesData.filter(n=>n&&typeof n.id==='string'&&typeof n.title==='string'&&typeof n.body==='string').slice(0,500).map(n=>({id:n.id.slice(0,40),title:n.title.slice(0,80),body:n.body.slice(0,12000),updated:Number.isFinite(n.updated)?n.updated:Date.now()}));
  if(s.msgs&&typeof s.msgs==='object'&&!Array.isArray(s.msgs)){
   msgs={};Object.entries(s.msgs).slice(0,100).forEach(([key,list])=>{if(!Array.isArray(list))return;msgs[key]=list.slice(-200).filter(m=>m&&typeof m.m==='string').map(m=>({m:m.m.slice(0,2000),t:typeof m.t==='string'?m.t.slice(0,20):'',me:!!m.me,r:!!m.r}))});
  }
  if(Array.isArray(s.ph))ph=s.ph.filter(q=>q&&Number.isInteger(q.s)&&q.s>=0&&q.s<SC.length&&Number.isInteger(q.f)&&q.f>=0&&q.f<FL.length).slice(0,30);
  if(s.wh&&['g','p'].includes(s.wh.t))wh=s.wh;
  if(s.wl&&['g','p'].includes(s.wl.t))wl=s.wl;
  if(s.quick&&typeof s.quick==='object')quick={...quick,...Object.fromEntries(Object.keys(quick).filter(x=>typeof s.quick[x]==='boolean').map(x=>[x,s.quick[x]]))};
  if(Array.isArray(s.notices))notices=s.notices.filter(n=>n&&typeof n.title==='string'&&typeof n.body==='string').slice(0,12).map(n=>({title:n.title.slice(0,100),body:n.body.slice(0,500),time:typeof n.time==='string'?n.time.slice(0,40):''}));
  if(Array.isArray(s.CT))CT=s.CT.filter(c=>Array.isArray(c)&&typeof c[0]==='string'&&typeof c[1]==='string').slice(0,100).map(c=>[c[0].slice(0,60),c[1].slice(0,40)]);
  if(typeof s.mynum==='string')mynum=s.mynum.slice(0,24);
  if(s.pm&&typeof s.pm==='object'&&!Array.isArray(s.pm)){pm={};Object.entries(s.pm).slice(0,100).forEach(([key,list])=>{if(!HRE.test(key)||!Array.isArray(list))return;pm[key]=list.slice(-200).filter(m=>m&&typeof m.m==='string').map(m=>({m:m.m.slice(0,300),t:typeof m.t==='string'?m.t.slice(0,20):'',me:!!m.me}))})}
  if(Number.isFinite(s.heat))heat=Math.max(0,Math.min(100,s.heat));
  if(Array.isArray(s.bag))bag=s.bag.filter(x=>typeof x==='string').slice(0,100);
  if(Array.isArray(s.hold))hold=AS.map((_,i)=>Math.max(0,Math.floor(+s.hold[i]||0)));
  if(Array.isArray(s.px))px=AS.map((a,i)=>Number.isFinite(s.px[i])?Math.max(0,Math.min(100000,s.px[i])):a[2]);
  if(Number.isInteger(s.rt))rt=((s.rt%RT.length)+RT.length)%RT.length;
  if(Number.isInteger(s.wt))wt=s.wt?1:0;
  if(Number.isInteger(s.ft))ft=Math.max(0,Math.min(FL.length-1,s.ft));
  if(Number.isInteger(s.cs))cs=Math.max(0,Math.min(SC.length-1,s.cs));
  if(Number.isInteger(s.cmt))cmt=s.cmt?1:0;
  if(s.inc===null)inc=null;else if(s.inc&&typeof s.inc.n==='string'&&typeof s.inc.p==='string'&&typeof s.inc.from==='string')inc={n:s.inc.n.slice(0,80),p:s.inc.p.slice(0,40),from:s.inc.from.slice(0,40)};
  if(typeof s.passHash==='string'&&/^[a-f0-9]{64}$/.test(s.passHash)&&typeof s.passSalt==='string'&&/^[a-f0-9]{32}$/.test(s.passSalt)){passHash=s.passHash;passSalt=s.passSalt;}
  if(me)scr=hasPasscode()?'lock':'home';
 }catch(e){console.warn('Could not restore Elara device data',e)}
}

function bankCategory(t){if(t.category)return t.category;const v=(String(t.title||'')+' '+String(t.note||'')).toLowerCase();if(v.includes('data'))return 'Data bundles';if(v.includes('minute')||v.includes('call'))return 'Call minutes';if(v.includes('airtime'))return 'Airtime';if(v.includes('bill')||v.includes('ecg')||v.includes('water'))return 'Utilities';if(v.includes('transfer'))return 'Transfers';return 'Other';}
function bankMonthlySummary(){const month=bankSummaryMonth||new Date().toISOString().slice(0,7),rows=bankTransactions.filter(t=>String(t.createdAt||'').slice(0,7)===month),debits=rows.filter(t=>t.direction==='debit'),credits=rows.filter(t=>t.direction==='credit').reduce((a,t)=>a+Number(t.amount||0),0),spent=debits.reduce((a,t)=>a+Number(t.amount||0),0),groups={};debits.forEach(t=>{const c=bankCategory(t);groups[c]=(groups[c]||0)+Number(t.amount||0)});const cats=Object.entries(groups).sort((a,b)=>b[1]-a[1]);return `<div class="shadecard"><b>Monthly spending summary</b><p class="mut">Based only on saved Sika Pay transactions.</p><label class="mut">Month</label><input class="fld" id="bankSummaryMonth" type="month" value="${bankEsc(month)}"><button class="big grn" data-x="bank_summary_apply">View month</button><div class="row"><div>Money spent</div><b style="color:#ff8b91">${bankMoney(spent)}</b></div><div class="row"><div>Money received</div><b style="color:#70d7a0">${bankMoney(credits)}</b></div><div class="row"><div>Debit transactions</div><b>${debits.length}</b></div><div class="row"><div>All recorded transactions</div><b>${rows.length}</b></div></div><div class="shadecard"><b>Spending by category</b>${cats.length?cats.map(([c,v])=>`<div class="row"><div>${bankEsc(c)}</div><b>${bankMoney(v)}</b></div>`).join(''):'<p class="mut">No outgoing transactions recorded for this month.</p>'}</div>${rows.length?rows.map(bankTxRow).join(''):'<p class="mut">No Sika Pay transactions for this month.</p>'}<p class="mut">This does not include purchases made outside Sika Pay or older phone activity that is not stored in the structured Sika Pay ledger.</p>`}
function bankOverview(){const recent=bankTransactions.slice(0,4);return `<div class="shadecard" style="background:linear-gradient(135deg,#173b73,#10213f);border:1px solid #426aa8;padding:17px"><small style="color:#c6d7f4">AVAILABLE BALANCE · DEMO</small><div style="font-size:29px;font-weight:600;margin:8px 0">${bankMoney(bal)}</div><div style="color:#c6d7f4;font-size:12px">${BANK_ACCOUNT.type} · ${BANK_ACCOUNT.number}</div></div><div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0"><button class="btn" data-x="bank_transfer">↗ Transfer</button><button class="btn" data-x="bank_statement">▤ Statements</button><button class="btn" data-x="bank_activity">↻ Activity</button><button class="btn" data-x="bank_airtime">📶 Airtime & data</button><button class="btn" data-x="bank_bills">🧾 Bill payments</button><button class="btn" data-x="bank_details">▣ Account details</button></div><div class="shadecard"><b>Wallet snapshot</b><div class="row"><div>Account holder<br><small>${bankEsc(me?.n||'Elara Demo User')}</small></div></div><div class="row"><div>Wallet ID<br><small>${BANK_ACCOUNT.number}</small></div></div><div class="row"><div>Branch<br><small>${BANK_ACCOUNT.branch}</small></div></div><div class="row"><div>Wallet type<br><small>${BANK_ACCOUNT.type}</small></div></div></div><b>Recent transactions</b>${recent.length?recent.map(bankTxRow).join(''):'<p class="mut">No Sika Pay transfers yet. Try a demo transfer to create your first receipt.</p>'}${bankLegacyActivity()}<div class="shadecard" style="border-color:#8b5b26"><b>Simulation notice</b><div style="margin-top:5px;color:#c5cddd">This is a local demonstration account. It is not a bank account and cannot send or receive real money.</div></div>`}
function bankActivityView(){
 const f=bankActivityFilter;
 const q=String(f.q||'').trim().toLowerCase();
 const rows=bankTransactions.filter(t=>{
  const hay=[t.id,t.title,t.description,t.recipient,t.destination,t.note,t.status].join(' ').toLowerCase();
  if(q&&!hay.includes(q))return false;
  if(f.type!=='all'&&t.direction!==f.type)return false;
  const day=String(t.createdAt||'').slice(0,10);
  if(f.from&&day<f.from)return false;
  if(f.to&&day>f.to)return false;
  return true;
 });
 return `<div class="shadecard"><b>Find a transaction</b><label class="mut">Search reference, recipient, service or details</label><input class="fld" id="bankActivityQuery" value="${bankEsc(f.q)}" maxlength="100" placeholder="Search transactions"><label class="mut">Transaction type</label><select class="fld" id="bankActivityType"><option value="all" ${f.type==='all'?'selected':''}>All transactions</option><option value="debit" ${f.type==='debit'?'selected':''}>Money out</option><option value="credit" ${f.type==='credit'?'selected':''}>Money in</option></select><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div><label class="mut">From date</label><input class="fld" id="bankActivityFrom" type="date" value="${bankEsc(f.from)}"></div><div><label class="mut">To date</label><input class="fld" id="bankActivityTo" type="date" value="${bankEsc(f.to)}"></div></div><button class="big grn" data-x="bank_activity_apply">Apply filters</button><button class="btn" data-x="bank_activity_clear">Clear filters</button></div><div class="row"><b>${rows.length} matching transaction${rows.length===1?'':'s'}</b><small>${bankTransactions.length} saved</small></div>${rows.length?rows.map(bankTxRow).join(''):'<p class="mut">No transactions match these filters.</p>'}`;
}
function bankTxRow(t){return `<div class="row" style="cursor:pointer" data-x="bank_tx_${bankEsc(t.id)}"><i style="background:${t.direction==='debit'?'#7b3038':'#246347'}">${t.direction==='debit'?'↗':'↙'}</i><div>${bankEsc(t.title)}<br><small>${new Date(t.createdAt).toLocaleString()} · ${bankEsc(bankCategory(t))} · ${bankEsc(t.status)}</small></div><b style="font-size:13px;color:${t.direction==='debit'?'#ff8b91':'#70d7a0'}">${t.direction==='debit'?'-':'+'}${bankMoney(t.amount)}</b></div>`}
function bankTransferForm(){return `<div class="shadecard"><b>New transfer</b><p class="mut">Available demo balance: ${bankMoney(bal)}</p><label class="mut">Recipient full name</label><input class="fld" id="bankRecipient" maxlength="80" placeholder="e.g. Ama Mensah"><label class="mut">Destination</label><select class="fld" id="bankNetwork"><option>Other bank</option><option>MTN Mobile Money</option><option>Telecel Cash</option><option>AT Money</option></select><label class="mut">Account / wallet number</label><input class="fld" id="bankDestination" inputmode="tel" maxlength="24" placeholder="e.g. 0241234567"><label class="mut">Amount (GHS)</label><input class="fld" id="bankAmount" type="number" min="1" max="2000" step="0.01" placeholder="0.00"><label class="mut">Payment note (optional)</label><input class="fld" id="bankNote" maxlength="100" placeholder="What is this payment for?"><div class="mut">Demo fee: GH₵ 0.00 · Per-transfer demo limit: GH₵ 2,000</div><button class="big grn" data-x="bank_review">Review transfer</button><button class="btn" data-x="bank_overview">Cancel</button></div>`}
function bankConfirmView(){const d=bankDraft;if(!d)return bankTransferForm();return `<div class="shadecard" style="border-color:#d2a34d"><b>Review carefully before confirming</b><p class="mut">This is the final confirmation screen. No balance has been deducted yet.</p></div><div class="shadecard"><small class="mut">YOU ARE SENDING</small><div style="font-size:28px;font-weight:600;margin:6px 0">${bankMoney(d.amount)}</div><div class="row"><div>Recipient<br><small>${bankEsc(d.recipient)}</small></div></div><div class="row"><div>Destination type<br><small>${bankEsc(d.network)}</small></div></div><div class="row"><div>Account / wallet<br><small>${bankEsc(d.destination)}</small></div></div><div class="row"><div>Payment note<br><small>${bankEsc(d.note||'Not provided')}</small></div></div><div class="row"><div>Transfer fee<br><small>GH₵ 0.00 (demo)</small></div></div><div class="row"><div>Total debit<br><b>${bankMoney(d.amount)}</b></div></div><div class="row"><div>Balance after transfer<br><b>${bankMoney(bal-d.amount)}</b></div></div></div><label class="mut">Re-enter your phone passcode to authorise</label><input class="fld" id="bankAuthPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off" placeholder="4-digit phone passcode"><button class="big grn" data-x="bank_confirm">Authorise & confirm demo transfer</button><button class="btn" data-x="bank_edit">Edit details</button> <button class="btn" data-x="bank_overview">Cancel</button>`}
function bankReceiptView(t){if(!t)return '<p class="mut">Receipt not found.</p>';return `<div class="shadecard" style="text-align:center;border-color:#36865d"><div style="font-size:34px;color:#70d7a0">✓</div><b>Transaction receipt</b><div class="mut">DEMO · NOT A BANK CONFIRMATION</div><div style="font-size:28px;font-weight:600;margin:12px 0">${bankMoney(t.amount)}</div><b style="color:#70d7a0">${bankEsc(t.status)}</b></div><div class="shadecard"><div class="row"><div>Transaction reference<br><small>${bankEsc(t.id)}</small></div></div><div class="row"><div>Date and time<br><small>${new Date(t.createdAt).toLocaleString()}</small></div></div><div class="row"><div>Transaction<br><small>${bankEsc(t.title)}</small></div></div><div class="row"><div>Recipient / details<br><small>${bankEsc(t.recipient||t.description||'—')} ${t.destination?'· '+bankEsc(t.destination):''}</small></div></div>${t.bundleValue?`<div class="row"><div>Bundle / airtime value<br><small>${bankEsc(t.bundleValue)}</small></div></div>`:''}<div class="row"><div>Note<br><small>${bankEsc(t.note||'—')}</small></div></div><div class="row"><div>Fee<br><small>${bankMoney(t.fee||0)}</small></div></div><div class="row"><div>Account<br><small>${BANK_ACCOUNT.number}</small></div></div></div><button class="big grn" data-x="bank_print">Print / Save receipt</button><button class="btn" data-x="bank_statement">View statement</button> <button class="btn" data-x="bank_overview">Done</button>`}
function bankStatement(){const rows=bankTransactions;const credits=rows.filter(t=>t.direction==='credit').reduce((a,t)=>a+t.amount,0),debits=rows.filter(t=>t.direction==='debit').reduce((a,t)=>a+t.amount,0);return `<div class="shadecard"><b>Account statement</b><p class="mut">Sika Pay demo wallet · ${BANK_ACCOUNT.number}</p><div class="row"><div>Opening demo balance<br><small>Illustrative only</small></div><b>${bankMoney(2500)}</b></div><div class="row"><div>Total credits</div><b style="color:#70d7a0">${bankMoney(credits)}</b></div><div class="row"><div>Total debits</div><b style="color:#ff8b91">${bankMoney(debits)}</b></div><div class="row"><div>Current balance</div><b>${bankMoney(bal)}</b></div></div><button class="btn" data-x="bank_csv">Export CSV</button> <button class="btn" data-x="bank_overview">Back</button><p class="mut">This is a local demo transfer ledger, not a formal bank statement. App downloads, rides and other phone purchases can also change the wallet balance and are shown separately in phone activity.</p>${rows.length?rows.map(bankTxRow).join(''):'<p class="mut">No transactions for this statement period.</p>'}`}
function bankSecurity(){return `<div class="shadecard"><b>Sika Pay security centre</b><div class="row"><div>Phone passcode protection<br><small>${hasPasscode()?'Enabled · PBKDF2 salted hash':'Not enabled · transfers are blocked'}</small></div><b>${hasPasscode()?'ON':'OFF'}</b></div><div class="row"><div>Transfer authorisation<br><small>Passcode required on every demo transfer</small></div></div><div class="row"><div>Per-transfer demo limit<br><small>GH₵ 2,000</small></div></div><div class="row"><div>Account number display<br><small>Masked by default</small></div></div><div class="row"><div>Payment connection<br><small>Disabled · no live bank or mobile-money API</small></div></div></div><div class="shadecard"><b>Local data privacy</b><p class="mut">Your profile, notes, messages and demo activity are saved in this browser on this device. Browser storage is not encrypted by this prototype. Anyone with access to this browser profile or its developer tools may be able to inspect that data. Use fictional details only and do not store passwords, OTPs or real financial information.</p></div><div class="shadecard"><b>Security reminders</b><p class="mut">Never share your PIN, password or one-time code. Verify the recipient and destination before confirming. Elara will not ask you to disclose an OTP to another person.</p></div><button class="btn" data-x="bank_overview">Back to overview</button>`}
function bankDetails(){return `<div class="shadecard"><b>Account information</b>${[['Account name',BANK_ACCOUNT.name],['Account holder',me?.n||'Elara Demo User'],['Account number',BANK_ACCOUNT.number],['Wallet type',BANK_ACCOUNT.type],['Currency','Ghana cedi (GHS)'],['Service area',BANK_ACCOUNT.branch]].map(([a,b])=>`<div class="row"><div>${a}<br><small>${bankEsc(b)}</small></div></div>`).join('')}</div><p class="mut">These are fictional demo details. Do not use them for real transfers or identity verification.</p><button class="btn" data-x="bank_overview">Back</button>`}
function bankView(){const nav=`<div style="display:flex;gap:6px;overflow:auto;margin-bottom:10px">${[['overview','Overview'],['transfer','Transfer'],['airtime','Airtime'],['bills','Bills'],['activity','Activity'],['monthly','Monthly'],['statement','Statement'],['details','Details'],['security','Security']].map(([id,n])=>`<button class="btn" data-x="bank_tab_${id}" style="white-space:nowrap;${bankTab===id?'background:#9DB4FF':''}">${n}</button>`).join('')}</div>`;let content=bankTab==='overview'?bankOverview():bankTab==='transfer'?bankTransferForm():bankTab==='airtime'?bankServiceForm('airtime'):bankTab==='bills'?bankServiceForm('bill'):bankTab==='service_confirm'?bankServiceConfirmView():bankTab==='confirm'?bankConfirmView():bankTab==='receipt'?bankReceiptView(bankReceipt):bankTab==='statement'?bankStatement():bankTab==='details'?bankDetails():bankTab==='security'?bankSecurity():bankTab==='monthly'?bankMonthlySummary():bankActivityView();return `<div class="shadecard" style="background:#101d34;border-color:#304e7b"><small style="color:#b8ccef">SIKA PAY · WALLET DEMO</small><div style="font-size:11px;color:#9fb2d0;margin-top:4px">Protected local simulation · No live payment connection</div></div>${nav}${content}`}
const bankBodyBase=body;
body=function(){return app==='pay'?bankView():bankBodyBase()};
const bankXBase=X;
X=function(c){
 if(c==='ussd_done'){ussdScreen=null;call='';return render()}
 if(c==='ussd_buy'){ussdScreen=null;app='pay';bankTab='airtime';return render()}
 if(c==='sim_network'){simState.network=$('#simNetwork')?.value||'MTN';savePhoneState();return render()}
 if(c==='bank_overview'){bankTab='overview';bankDraft=null;serviceDraft=null;return render()}
 if(c==='bank_transfer'){bankTab='transfer';bankDraft=null;return render()}
 if(c==='bank_airtime'){bankTab='airtime';serviceDraft=null;return render()}
 if(c==='bank_bills'){bankTab='bills';serviceDraft=null;return render()}
 if(c==='svc_review_airtime'){return bankStartService('airtime')}
 if(c==='svc_review_bill'){return bankStartService('bill')}
 if(c==='svc_confirm'){return bankConfirmService()}
 if(c==='svc_edit'){bankTab=serviceDraft?.kind==='bill'?'bills':'airtime';return render()}
 if(c==='bank_review'){return bankStartTransfer()}
 if(c==='bank_confirm'){return bankConfirmTransfer()}
 if(c==='bank_edit'){bankTab='transfer';return render()}
 if(c==='bank_statement'){bankTab='statement';return render()}
 if(c==='bank_activity'){bankTab='activity';return render()}
 if(c==='bank_summary_apply'){const m=$('#bankSummaryMonth')?.value||'';if(!/^\d{4}-\d{2}$/.test(m))return toast('Choose a valid month.');bankSummaryMonth=m;bankTab='monthly';return render()}
 if(c==='bank_activity_apply'){const from=$('#bankActivityFrom')?.value||'',to=$('#bankActivityTo')?.value||'';if(from&&to&&from>to)return toast('The start date must be before the end date.');bankActivityFilter={q:($('#bankActivityQuery')?.value||'').trim().slice(0,100),type:$('#bankActivityType')?.value||'all',from,to};return render()}
 if(c==='bank_activity_clear'){bankActivityFilter={q:'',type:'all',from:'',to:''};return render()}
 if(c==='bank_details'){bankTab='details';return render()}
 if(c.startsWith('bank_tab_')){bankTab=c.slice(9);return render()}
 if(c.startsWith('bank_tx_')){const id=c.slice(8);bankReceipt=bankTransactions.find(t=>t.id===id)||null;bankTab='receipt';return render()}
 if(c==='bank_print'){const t=bankReceipt;if(!t)return;const w=window.open('','_blank');if(!w)return toast('Pop-up blocked. Use Export CSV for your records.');w.document.write('<title>Elara demo receipt</title><pre>'+bankEsc(JSON.stringify(t,null,2))+'</pre><p>DEMO ONLY — NOT A BANK CONFIRMATION</p>');w.document.close();w.print();return}
 if(c==='bank_csv'){const cell=v=>{let x=String(v??'');if(typeof v==='string'&&/^[\s]*[=+@\-]/.test(x))x="'"+x;return '"'+x.replace(/"/g,'""')+'"'};const lines=[['Reference','Date','Type','Description','Recipient','Destination','Note','Amount GHS','Fee GHS','Status'],...bankTransactions.map(t=>[t.id,t.createdAt,t.direction,t.title,t.recipient||'',t.destination||'',t.note||'',t.amount,t.fee||0,t.status])];const csv='\uFEFF'+lines.map(r=>r.map(cell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='elara-demo-account-statement.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}
 return bankXBase(c)
};

reset();restorePhoneState();render();
</script></body></html>
