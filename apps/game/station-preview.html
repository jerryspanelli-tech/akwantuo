  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#101a23" />
    <title>AKWANTUO — Railway Station Preview</title>
  </head>
  <body>
    <main class="station-preview">
      <canvas id="station-preview-canvas" aria-label="Interactive 3D ultra-modern railway station preview"></canvas>

    <script type="module" src="/src/stationPreview.ts"></script>
