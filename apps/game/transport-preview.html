<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101a23" />
    <title>AKWANTUO — Transport Interchange Preview</title>
  </head>
  <body>
    <main class="station-preview">
      <canvas id="station-preview-canvas" aria-label="Interactive 3D railway station and public transport interchange preview"></canvas>
      <section class="station-preview__heading">
        <span class="station-preview__eyebrow">AKWANTUO · TRANSPORT NETWORK</span>
        <h1>Station Transport Hub</h1>
        <p>Rail · Trotro · Bus · Taxi · Pedestrian</p>
      </section>
      <section class="station-preview__note">
        <strong>Transport interchange prototype</strong>
        <span>Orbit and zoom to inspect the station forecourt and train. Drive the demo saloon with keyboard or the touch controls. Vehicle handling is a prototype without collision.</span>
      </section>
      <section class="station-preview__drive" aria-label="Touch driving controls">
        <div class="station-preview__drive-steer">
          <button type="button" data-drive="a" aria-label="Steer left">◀</button>
          <button type="button" data-drive="d" aria-label="Steer right">▶</button>
        </div>
        <div class="station-preview__drive-pedals">
          <button type="button" data-drive="w" aria-label="Accelerate">ACCEL</button>
          <button type="button" data-drive=" " aria-label="Brake">BRAKE</button>
          <button type="button" data-drive="s" aria-label="Reverse">REV</button>
        </div>
      </section>
      <div id="station-preview-error" class="station-preview__error" hidden></div>
    </main>
    <script type="module" src="/src/transportPreview.ts"></script>
  </body>
</html>
