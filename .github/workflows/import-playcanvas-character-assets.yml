name: Import verified Ghanaian 3D character assets

on:
  push:
    branches:
      - engine/playcanvas-world-foundation
    paths:
      - ".github/workflows/import-playcanvas-character-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: akwantuo-playcanvas-character-assets
  cancel-in-progress: false

jobs:
  import:
    name: Import and validate the existing rigged GLB assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out PlayCanvas world branch
        uses: actions/checkout@v4
        with:
          ref: engine/playcanvas-world-foundation
          fetch-depth: 1

      - name: Check out the isolated character asset branch
        uses: actions/checkout@v4
        with:
          ref: feat/ghanaian-character-assets
          path: character-assets-source
          fetch-depth: 1

      - name: Copy the existing generated GLB assets
        run: |
          set -euo pipefail
          destination="apps/game/public/assets/characters"
          mkdir -p "$destination"
          for asset in akwantuo-male.glb akwantuo-female.glb idle.glb walk.glb; do
            source="character-assets-source/apps/game/public/assets/characters/$asset"
            test -s "$source" || { echo "Missing character asset: $source"; exit 1; }
            cp "$source" "$destination/$asset"
          done

      - name: Validate GLB structure, skinning and separate animation clips
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const root = 'apps/game/public/assets/characters';
          const readGlb = (file) => {
            const full = path.join(root, file);
            const bytes = fs.readFileSync(full);
            if (bytes.toString('ascii', 0, 4) !== 'glTF') throw new Error(file + ': invalid GLB magic');
            if (bytes.readUInt32LE(4) !== 2 || bytes.readUInt32LE(8) !== bytes.length) throw new Error(file + ': invalid GLB 2.0 header');
            const jsonLength = bytes.readUInt32LE(12);
            const doc = JSON.parse(bytes.subarray(20, 20 + jsonLength).toString('utf8').trim());
            console.log(file + ': ' + (bytes.length / 1048576).toFixed(2) + ' MB; meshes=' + (doc.meshes?.length ?? 0) + '; skins=' + (doc.skins?.length ?? 0) + '; clips=' + (doc.animations ?? []).map((clip) => clip.name).join(', '));
            return doc;
          };
          for (const file of ['akwantuo-male.glb', 'akwantuo-female.glb']) {
            const doc = readGlb(file);
            if (!doc.meshes?.length || !doc.skins?.length) throw new Error(file + ': skinned character mesh is required');
          }
          const idle = readGlb('idle.glb');
          const walk = readGlb('walk.glb');
          if (!(idle.animations ?? []).some((clip) => /idle/i.test(clip.name ?? ''))) throw new Error('idle.glb: Idle animation clip not found');
          if (!(walk.animations ?? []).some((clip) => /walk/i.test(clip.name ?? ''))) throw new Error('walk.glb: Walk animation clip not found');
          if (!(idle.skins?.length) || !(walk.skins?.length)) throw new Error('Animation GLBs must include the rig/skeleton binding data');
          NODE

      - name: Record asset provenance
        run: |
          cat > apps/game/public/assets/characters/ASSET-LICENSES.md <<'EOF'
          # AKWANTUO character asset provenance

          These game-ready GLB files are imported from the isolated
          feat/ghanaian-character-assets branch. They are generated using Ara 3D Gen.

          - Ara 3D Gen source: https://github.com/olatunde85/3d-gen (MIT).
          - MakeHuman base data: CC0 1.0.
          - Motion-capture clips derive from the CMU Graphics Lab Motion Capture Database.
            Product use is permitted; the motion data itself must not be resold on its own.

          The male and female GLBs must each contain a skinned mesh and embedded idle
          and walk clips. Keep the source branch isolated; this workflow copies only
          the four runtime GLBs and does not merge or modify that branch.
          EOF

      - name: Commit assets to the PlayCanvas branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/game/public/assets/characters
          if git diff --cached --quiet; then
            echo "Character assets are already current."
            exit 0
          fi
          git commit -m "feat: import rigged Ghanaian character GLB assets"
          git push origin HEAD:engine/playcanvas-world-foundation
