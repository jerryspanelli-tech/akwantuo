name: AKWANTUO CI

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  game-client:
    name: Typecheck and build game client
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js (match Vercel runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck shared package and game client
        run: npm run typecheck
      - name: Build game client
        run: npm run build

  supabase-connectivity:
    name: Supabase connectivity diagnostic
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js (match Vercel runtime)
        uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Verify live AKWANTUO Supabase connection
        run: node apps/game/scripts/verify-supabase-connection.mjs
