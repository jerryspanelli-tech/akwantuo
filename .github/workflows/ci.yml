name: AKWANTUO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  game-client:
    name: Typecheck and build game client
    runs-on: ubuntu-latest
    # Match the repository engine requirement and transport-preview runtime.
    # Only the public browser key is exposed to the client build. Never use a service-role key.
    env:
      VITE_SUPABASE_URL: ${{ secrets.AKWANTUO_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.AKWANTUO_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install dependencies
        run: npm install
      - name: Verify dedicated AKWANTUO Supabase connection (when configured)
        run: node apps/game/scripts/verify-supabase-connection.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify configured AKWANTUO project is present in browser bundle
        if: env.VITE_SUPABASE_URL != ''
        run: grep -R -q 'ugiysogfkclbcryhtkyn.supabase.co' apps/game/dist/assets
