name: AKWANTUO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  game-client:
    name: Typecheck and build game client
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Verify live AKWANTUO Supabase connection (when configured)
        env:
          VITE_SUPABASE_URL: ${{ secrets.AKWANTUO_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.AKWANTUO_SUPABASE_PUBLISHABLE_KEY }}
        run: node apps/game/scripts/verify-supabase-connection.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
