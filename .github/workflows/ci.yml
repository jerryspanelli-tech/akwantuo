name: AKWANTUO CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  game-client:
    name: Typecheck and build game client
    runs-on: ubuntu-latest
    # Only the public browser key is exposed to the client build. Never use a service-role key.
    env:
      VITE_SUPABASE_URL: ${{ secrets.AKWANTUO_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.AKWANTUO_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Verify dedicated AKWANTUO Supabase connection
        run: node apps/game/scripts/verify-supabase-connection.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Verify built browser bundle is isolated to AKWANTUO
        run: |
          if grep -R -q 'fktvbxmgseojcvztheqz.supabase.co' apps/game/dist/assets; then
            echo 'Accra Life Supabase URL leaked into the AKWANTUO browser bundle.'
            exit 1
          fi
          grep -R -q 'ugiysogfkclbcryhtkyn.supabase.co' apps/game/dist/assets
