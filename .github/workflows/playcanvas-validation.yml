name: AKWANTUO PlayCanvas validation

on:
  push:
    branches: ["engine/playcanvas-world-foundation"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  playcanvas-client:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
