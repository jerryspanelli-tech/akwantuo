name: AKWANTUO Transport Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/game/src/world/railStationGeometry.ts"
      - "apps/game/src/world/railTrainGeometry.ts"
      - "apps/game/src/world/railTrainOperations.ts"
      - "apps/game/src/world/railTrainRig.ts"
      - "apps/game/src/world/playableRailDemo.ts"
      - "apps/game/src/world/railService.ts"
      - "apps/game/src/world/mappedRailService.ts"
      - "apps/game/src/world/railStations.ts"
      - "apps/game/src/world/railStationFitout.ts"
      - "apps/game/src/world/railStationAccessGeometry.ts"
      - "apps/game/src/world/railStationInterchange.ts"
      - "apps/game/src/world/stationInterchangeGeometry.ts"
      - "apps/game/src/world/railTrackDesign.ts"
      - "apps/game/src/world/railTrackGeometry.ts"
      - "apps/game/src/world/trafficRules.ts"
      - "apps/game/src/world/trafficSignals.ts"
      - "apps/game/src/world/pedestrianCrossingGeometry.ts"
      - "apps/game/src/world/railRoadCrossings.ts"
      - "apps/game/src/vehicles/roadVehicles.ts"
      - "apps/game/src/vehicles/roadVehicleGeometry.ts"
      - "apps/game/src/vehicles/roadVehicleRig.ts"
      - "apps/game/src/vehicles/roadVehicleDynamics.ts"
      - "apps/game/src/vehicles/roadVehicleAutopilot.ts"
      - "apps/game/src/vehicles/motorcycleDynamics.ts"
      - "apps/game/src/vehicles/vehicleInteraction.ts"
      - "apps/game/src/vehicles/vehicleCollision.ts"
      - "apps/game/src/vehicles/publicTransportVehicle.ts"
      - "apps/game/src/main.ts"
      - "apps/game/src/world/greaterAccraPlayableWorld.ts"
      - "apps/game/src/world/config.ts"
      - "apps/game/src/world/previewWorld.ts"
      - "apps/game/src/world/railNetwork.ts"
      - "apps/game/src/world/railStations.ts"
      - "apps/game/src/world/roadDesign.ts"
      - "apps/game/src/world/junctionLayouts.ts"
      - "apps/game/src/world/circleInterchangeGeometry.ts"
      - "apps/game/src/world/transportSmokeChecks.ts"
      - "apps/game/src/world/roadRouting.ts"
      - "apps/game/src/world/roadNavigation.ts"
      - "apps/game/src/vehicles/passengerCamera.ts"
      - "apps/game/scripts/verify-transport-browser.mjs"
      - "apps/game/src/world/publicTransportOperations.ts"
      - "apps/game/src/world/publicTransportRoutes.ts"
      - "apps/game/station-preview.css"
      - "apps/game/src/transportPreview.ts"
      - "apps/game/src/greaterAccraTransportPreview.ts"
      - "apps/game/src/world/greaterAccraLayout.ts"
      - "apps/game/src/world/roadGeometry.ts"
      - "apps/game/src/world/roadMarkingGeometry.ts"
      - "apps/game/greater-accra-transport-preview.html"
      - "apps/game/greater-accra-transport-preview.css"
      - "apps/game/scripts/verify-greater-accra-map.mjs"
      - "apps/game/transport-preview.html"
      - "apps/game/vite.config.ts"
      - "apps/game/package.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/transport-preview.yml"

permissions:
  contents: read

jobs:
  capture-preview:
    name: Build and capture transport preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Playwright for browser verification
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium for screenshot capture
        run: npx playwright install --with-deps --only-shell chromium
      - name: Start production preview server
        run: |
          npm exec --workspace @akwantuo/game -- vite preview --host 127.0.0.1 --port 4173 > /tmp/akwantuo-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/transport-preview.html > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/akwantuo-preview.log
          exit 1
      - name: Verify main game transport startup on desktop and mobile
        run: |
          mkdir -p artifacts
          node apps/game/scripts/verify-transport-browser.mjs
      - name: Verify Greater Accra road-network map preview
        run: node apps/game/scripts/verify-greater-accra-map.mjs
      - name: Capture transport preview screenshot
        run: |
          mkdir -p artifacts
          npx --yes playwright screenshot --browser chromium --viewport-size "1440,1000" --wait-for-timeout 6000 http://127.0.0.1:4173/transport-preview.html artifacts/akwantuo-transport-preview.png
          test -s artifacts/akwantuo-transport-preview.png
      - name: Write build report
        run: |
          mkdir -p artifacts
          {
            echo "AKWANTUO transport preview report"
            echo "Build target: production Vite preview"
            echo "Page: /transport-preview.html"
            echo "Viewport: 1440 x 1000"
            echo "Screenshots: artifacts/akwantuo-transport-preview.png, artifacts/akwantuo-desktop-transport-game.png, artifacts/akwantuo-mobile-transport-game.png, artifacts/akwantuo-greater-accra-road-network.png, artifacts/akwantuo-greater-accra-road-network-detail.png"
            echo "Scope: the main playable scene instantiates Greater Accra-scale terrain, first-release road corridors and lane markings, Circle interchange structures, two schematic Cape-gauge rail routes, three planned station anchors and four provisional road/rail crossing review markers. A two-car train waits for boarding at the Accra Central anchor, then runs the schematic Accra Central–Odaw–Achimota–Tema route and permits terminal alighting at Tema. The scene also retains the local playable saloon, temporary trotro passenger journey and separate local two-car rail demo. Four planning-only public-transport corridors are derived from the road graph and shown as coloured overlays in the developer map preview. Developer previews include ultra-modern station architecture and public-transport forecourt concepts."
            echo "Validation: npm typecheck and production Vite build; startup smoke checks cover road projection, lane-centre offsets, public-transport corridor connectivity, rail-road crossing candidates and fail-safe interlock states, mapped rail passenger boarding/alighting state, vehicle handling and passenger operations. Chromium opens the main game on desktop and mobile-sized viewports, asserts the Greater Accra road/rail network, four crossing candidates, four proposed transit corridors and mapped train origin boarding availability, then completes the local trotro boarding/camera/terminal/alighting journey. A second Chromium check opens the Greater Accra map preview, verifies readiness and captures overview plus zoomed screenshots."
            echo "Limitations: the Greater Accra roads, Circle interchange and railway are schematic visual planning geometry, not surveyed GIS or engineering alignments. The major corridors are present in the main scene, but local streets, district buildings and detailed frontage access are incomplete. Road projection and lane-centre helpers are tested foundations but are not yet connected to driving controls; road/rail meshes have no collision or lane-level navigation. Four road/rail intersections are review candidates only; the shallow Spintex–Tema crossing is flagged for redesign. The fail-safe crossing interlock is tested but not connected to live train/road movement, barrier animations or signal heads. No AI traffic, junction conflict control, railway signalling, switches, dispatch or live timetable is integrated. The mapped train has Accra Central boarding and Tema alighting code but no full end-to-end ride test, return service, finished station buildings, signals or block occupancy. Public transport corridors are planning-only; junction waypoints are not approved passenger stops and the local trotro journey still uses temporary preview stops. Vehicle physics remains prototype kinematics without tyre/suspension simulation, complete body collisions or server authority; fare, ownership and occupancy are local-only. Station anchors and footprints remain illustrative. Chromium desktop/mobile-sized checks are not physical-device tests."
          } > artifacts/transport-preview-report.txt
      - name: Upload screenshot and report
        uses: actions/upload-artifact@v4
        with:
          name: akwantuo-transport-preview
          path: artifacts/
          if-no-files-found: error
