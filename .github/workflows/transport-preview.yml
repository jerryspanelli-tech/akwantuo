name: AKWANTUO Transport Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/game/src/world/railStationGeometry.ts"
      - "apps/game/src/world/railTrainGeometry.ts"
      - "apps/game/src/world/railTrainOperations.ts"
      - "apps/game/src/world/railTrainRig.ts"
      - "apps/game/src/world/playableRailDemo.ts"
      - "apps/game/src/world/railService.ts"
      - "apps/game/src/world/railStations.ts"
      - "apps/game/src/world/railStationFitout.ts"
      - "apps/game/src/world/railStationAccessGeometry.ts"
      - "apps/game/src/world/railStationInterchange.ts"
      - "apps/game/src/world/stationInterchangeGeometry.ts"
      - "apps/game/src/world/railTrackDesign.ts"
      - "apps/game/src/world/railTrackGeometry.ts"
      - "apps/game/src/world/trafficRules.ts"\n      - "apps/game/src/world/trafficSignals.ts"
      - "apps/game/src/vehicles/roadVehicles.ts"
      - "apps/game/src/vehicles/roadVehicleGeometry.ts"
      - "apps/game/src/vehicles/roadVehicleRig.ts"
      - "apps/game/src/vehicles/roadVehicleDynamics.ts"
      - "apps/game/src/vehicles/vehicleInteraction.ts"
      - "apps/game/src/vehicles/vehicleCollision.ts"
      - "apps/game/src/vehicles/publicTransportVehicle.ts"
      - "apps/game/src/main.ts"
      - "apps/game/src/world/transportSmokeChecks.ts"
      - "apps/game/src/vehicles/passengerCamera.ts"
      - "apps/game/scripts/verify-transport-browser.mjs"
      - "apps/game/src/world/publicTransportOperations.ts"
      - "apps/game/station-preview.css"
      - "apps/game/src/transportPreview.ts"
      - "apps/game/transport-preview.html"
      - "apps/game/vite.config.ts"
      - "apps/game/package.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/transport-preview.yml"

permissions:
  contents: read

jobs:
  capture-preview:
    name: Build and capture transport preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Playwright for browser verification
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium for screenshot capture
        run: npx playwright install --with-deps chromium
      - name: Start production preview server
        run: |
          npm exec --workspace @akwantuo/game -- vite preview --host 127.0.0.1 --port 4173 > /tmp/akwantuo-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/transport-preview.html > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/akwantuo-preview.log
          exit 1
      - name: Verify main game transport startup on desktop and mobile
        run: |
          mkdir -p artifacts
          node apps/game/scripts/verify-transport-browser.mjs
      - name: Capture transport preview screenshot
        run: |
          mkdir -p artifacts
          npx --yes playwright screenshot --browser chromium --viewport-size "1440,1000" --wait-for-timeout 6000 http://127.0.0.1:4173/transport-preview.html artifacts/akwantuo-transport-preview.png
          test -s artifacts/akwantuo-transport-preview.png
      - name: Write build report
        run: |
          mkdir -p artifacts
          {
            echo "AKWANTUO transport preview report"
            echo "Build target: production Vite preview"
            echo "Page: /transport-preview.html"
            echo "Viewport: 1440 x 1000"
            echo "Screenshots: artifacts/akwantuo-transport-preview.png, artifacts/akwantuo-desktop-transport-game.png, artifacts/akwantuo-mobile-transport-game.png"
            echo "Scope: ultra-modern railway station concept, passenger concourse fit-out, sheltered step-free forecourt walkway, illustrative trotro, city-bus, taxi and ride-hailing forecourt, and a preview-only moving two-car shuttle demonstrating the train rig and station-stop controller, plus a controllable saloon-car visual using the road-vehicle dynamics model and keyboard/touch controls. Startup smoke checks also cover vehicle entry/exit and public-transport boarding, fare deduction and alighting. Preview startup also smoke-checks that candidate Circle/Odaw is excluded from operational stops and that invalid train states are rejected."
            echo "Validation: npm typecheck and production Vite build; Chromium opens the main game on desktop and mobile-sized viewports, enters gameplay, boards the moving trotro, switches passenger camera, waits for the terminal, alights, checks uncaught page errors and captures screenshots."
            echo "Limitations: automated desktop/mobile-sized Chromium journey checks passed; this does not replace physical-device testing. Developer preview contains separate transport demonstrations; the main playable game now also includes a compact local rail track, ultra-modern station and moving two-car train with a station dwell; this local rail slice is not the Greater Accra mapped rail service; the moving preview shuttle is a short separate path and is not the Greater Accra mapped rail service; startup smoke checks cover prototype data rules only, not railway safety; no live network trains or traffic AI; the saloon uses prototype kinematics without road collision, tyre/suspension simulation or server authority; vehicle interaction and fare logic are local prototype rules and are not connected to a server wallet, seat reservations or live route timetable; the playable scene now includes a preview-only shared-trotro passenger ride between two temporary stops; those stops are not the approved Greater Accra route network; station-site coordinates remain illustrative."
          } > artifacts/transport-preview-report.txt
      - name: Upload screenshot and report
        uses: actions/upload-artifact@v4
        with:
          name: akwantuo-transport-preview
          path: artifacts/
          if-no-files-found: error
