name: AKWANTUO Transport Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/game/src/world/railStationGeometry.ts"
      - "apps/game/src/world/railTrainGeometry.ts"
      - "apps/game/src/world/railTrainOperations.ts"
      - "apps/game/src/world/railTrainRig.ts"
      - "apps/game/src/world/playableRailDemo.ts"
      - "apps/game/src/world/railService.ts"
      - "apps/game/src/world/mappedRailService.ts"
      - "apps/game/src/world/railStations.ts"
      - "apps/game/src/world/railStationFitout.ts"
      - "apps/game/src/world/railStationAccessGeometry.ts"
      - "apps/game/src/world/railStationInterchange.ts"
      - "apps/game/src/world/stationInterchangeGeometry.ts"
      - "apps/game/src/world/railTrackDesign.ts"
      - "apps/game/src/world/railTrackGeometry.ts"
      - "apps/game/src/world/trafficRules.ts"
      - "apps/game/src/world/trafficSignals.ts"
      - "apps/game/src/world/pedestrianCrossingGeometry.ts"
      - "apps/game/src/world/railRoadCrossings.ts"
      - "apps/game/src/vehicles/roadVehicles.ts"
      - "apps/game/src/vehicles/roadVehicleGeometry.ts"
      - "apps/game/src/vehicles/roadVehicleRig.ts"
      - "apps/game/src/vehicles/roadVehicleDynamics.ts"
      - "apps/game/src/vehicles/roadVehicleAutopilot.ts"
      - "apps/game/src/vehicles/motorcycleDynamics.ts"
      - "apps/game/src/vehicles/vehicleInteraction.ts"
      - "apps/game/src/vehicles/vehicleCollision.ts"
      - "apps/game/src/vehicles/publicTransportVehicle.ts"
      - "apps/game/src/main.ts"
      - "apps/game/src/world/greaterAccraPlayableWorld.ts"
      - "apps/game/src/world/config.ts"
      - "apps/game/src/world/previewWorld.ts"
      - "apps/game/src/world/ghanaianStreetBuildings.ts"
      - "apps/game/src/world/districtProperties.ts"
      - "apps/game/src/world/interiorBlueprints.ts"
      - "apps/game/src/world/interiorRooms.ts"
      - "apps/game/src/world/stage6SmokeChecks.ts"
      - "apps/game/src/world/districtBusinesses.ts"
      - "apps/game/src/world/venueProgramme.ts"
      - "apps/game/src/world/railNetwork.ts"
      - "apps/game/src/world/railStations.ts"
      - "apps/game/src/world/roadDesign.ts"
      - "apps/game/src/world/junctionLayouts.ts"
      - "apps/game/src/world/circleInterchangeGeometry.ts"
      - "apps/game/src/world/transportSmokeChecks.ts"
      - "apps/game/src/world/roadRouting.ts"
      - "apps/game/src/world/roadNavigation.ts"
      - "apps/game/src/vehicles/passengerCamera.ts"
      - "apps/game/scripts/verify-transport-browser.mjs"
      - "apps/game/src/world/publicTransportOperations.ts"
      - "apps/game/src/world/publicTransportRoutes.ts"
      - "apps/game/station-preview.css"
      - "apps/game/src/transportPreview.ts"
      - "apps/game/src/greaterAccraTransportPreview.ts"
      - "apps/game/src/world/greaterAccraLayout.ts"
      - "apps/game/src/world/roadGeometry.ts"
      - "apps/game/src/world/roadMarkingGeometry.ts"
      - "apps/game/greater-accra-transport-preview.html"
      - "apps/game/greater-accra-transport-preview.css"
      - "apps/game/scripts/verify-greater-accra-map.mjs"
      - "apps/game/transport-preview.html"
      - "apps/game/vite.config.ts"
      - "apps/game/package.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/transport-preview.yml"

permissions:
  contents: read

jobs:
  capture-preview:
    name: Build and capture transport preview
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Install Playwright for browser verification
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium for screenshot capture
        run: npx playwright install --with-deps --only-shell chromium
      - name: Start production preview server
        run: |
          npm exec --workspace @akwantuo/game -- vite preview --host 127.0.0.1 --port 4173 > /tmp/akwantuo-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/transport-preview.html > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/akwantuo-preview.log
          exit 1
      - name: Verify main game transport startup on desktop and mobile
        run: |
          mkdir -p artifacts
          node apps/game/scripts/verify-transport-browser.mjs
      - name: Verify Greater Accra road-network map preview
        run: node apps/game/scripts/verify-greater-accra-map.mjs
      - name: Capture transport preview screenshot
        run: |
          mkdir -p artifacts
          npx --yes playwright screenshot --browser chromium --viewport-size "1440,1000" --wait-for-timeout 6000 http://127.0.0.1:4173/transport-preview.html artifacts/akwantuo-transport-preview.png
          test -s artifacts/akwantuo-transport-preview.png
      - name: Write build report
        run: |
          mkdir -p artifacts
          {
            echo "AKWANTUO transport preview report"
            echo "Build target: production Vite preview"
            echo "Page: /transport-preview.html"
            echo "Viewport: 1440 x 1000"
            echo "Screenshots: artifacts/akwantuo-transport-preview.png, artifacts/akwantuo-desktop-transport-game.png, artifacts/akwantuo-mobile-transport-game.png, artifacts/akwantuo-desktop-mapped-rail.png, artifacts/akwantuo-mobile-mapped-rail.png, artifacts/akwantuo-desktop-shop-interior.png, artifacts/akwantuo-mobile-shop-interior.png, artifacts/akwantuo-desktop-creative-arts-centre.png, artifacts/akwantuo-mobile-creative-arts-centre.png, artifacts/akwantuo-greater-accra-road-network.png, artifacts/akwantuo-greater-accra-road-network-detail.png"
            echo "Stage 6 scope: 23 original Ghana-inspired street buildings across 12 use categories, with named Ghanaian businesses, facade signs, windows, awnings, compound gates and shared materials for lower draw overhead. A matching 23-record property directory prevents browser-side ownership transfer. A 17-entry business directory assigns service categories, example services, staff roles and illustrative operating hours to every non-residential premises. Ten 3D interior modules are instantiated for shops, salons, chop bars, family homes, guest houses, offices, clinics, workshops, apartments and a runway-ready creative arts hall; all 23 buildings link to one of these rooms, and E/ENTER opens a nearby building while E/EXIT returns outside. Desktop and mobile Chromium checks enter and exit one representative building for every interior type, including the Akwaaba Creative Arts & Events Centre. The original Akwaaba Creative Arts & Events Centre includes an arena-inspired domed exterior, glass entrance frontage, covered arrival forecourt, model runway, audience seating, stage screen and lighting trusses. Its fictional weekly programme includes modelling practice and casting, a Ghana fashion runway night, concerts and creative exhibitions. Desktop and mobile Chromium runs capture dedicated venue screenshots. These are first-release procedural prototypes, not final bespoke art assets or a live property economy."
            echo "Transport scope: the main playable scene instantiates Greater Accra-scale terrain, first-release road corridors and lane markings, Circle interchange structures, two schematic Cape-gauge rail routes, three planned station anchors and four provisional road/rail crossing review markers. A two-car train operates the schematic Accra Central–Odaw–Achimota–Tema route. Three local NPC saloons follow the N1 Tema corridor on its authored forward lane centre with a conservative headway speed controller. The scene also includes a locally playable saloon, a temporary trotro passenger journey and a separate local two-car rail demo. Four planning-only public-transport corridors are derived from the road graph and shown as coloured overlays in the developer map preview. Reusable motorcycle lean dynamics and pure-pursuit route-following foundations remain available for later vehicle integration. Developer previews include ultra-modern station architecture and public-transport forecourt concepts."
            echo "Validation: npm typecheck and production Vite build; startup smoke checks cover unique building catalogue entries, property-directory consistency, ten interior blueprint layouts and building-to-interior links, plus Stage 6 catalogue integrity (23 unique buildings, all 12 districts, 23 matching property records, 17 business records, all 23 building-to-interior links, ten valid interior blueprints, non-overlapping building footprints), road projection, road-specific lane-centre projection, pure-pursuit route following, motorcycle steering/lean/braking, public-transport corridor connectivity, rail-road crossing candidates and fail-safe interlock states, mapped rail passenger operations, vehicle handling and safe exit rules. Chromium opens the main game on desktop and mobile-sized viewports, asserts the Greater Accra road/rail network and three-car N1 lane-centred traffic convoy, completes the local trotro boarding/camera/terminal/alighting journey, then starts a separate local-only test session at Accra Central and completes the mapped Accra–Tema train ride and terminal alighting on both viewports. Local-only spawns verify entry, EXIT control and return to the street for all ten distinct interior types on both viewports. A second Chromium check opens the Greater Accra map preview, verifies readiness and captures overview plus zoomed screenshots."
            echo "Stage 6 limitations: the 23-building cluster is a compact first-release street block, not full district-wide Greater Accra coverage. Facades and interiors are procedural first-pass geometry; bespoke GLB building packs, richer furnishing, detailed collision and door animations remain. The Akwaaba Creative Arts & Events Centre is a first-pass original arena-inspired venue, not a final bespoke asset pack. All ten interior types, including the runway hall, have desktop and mobile-sized Chromium entry/exit coverage, but physical iPhone/Android performance has not been measured. Business directory information is displayed when entering a premises, but stock/inventory, real customer transaction loops, active NPC staff behaviour and schedules that control live access are not implemented. Business hours and service lists are illustrative game-design values, not real-world business listings. Property records are deliberately NPC-occupied and non-transferable; buying, renting, selling and ownership persistence must be implemented later with trusted server/database authority."
            echo "Transport limitations: Greater Accra roads, Circle interchange and railway remain schematic planning geometry, not surveyed GIS or engineering alignments. Local streets, district buildings and detailed frontage access are incomplete. The N1 lane-centre route is connected to the three-car NPC convoy, but player-driven vehicles are not yet lane-snapped; road/rail meshes still lack complete collision and lane-level navigation. The four road/rail intersections are review candidates only; the shallow Spintex–Tema crossing needs redesign. The fail-safe crossing interlock is tested but not connected to live train/road movement, barrier animations or signal heads. NPC traffic is currently limited to the N1 prototype convoy; junction conflict control, signal compliance, wider traffic coverage and multiplayer authority are not integrated. The mapped train ride is end-to-end tested, but there is no return service, operational timetable, finished station buildings, signalling or block occupancy. Motorcycle dynamics remain a foundation only: no rendered rideable motorcycle or rider pose is integrated. Public-transport corridors are planning-only; junction waypoints are not approved passenger stops and the trotro journey still uses temporary preview stops. Vehicle physics remains prototype kinematics without tyre/suspension simulation, complete body collisions or server authority; fare, ownership and occupancy are local-only. Station anchors and footprints remain illustrative. Chromium desktop/mobile-sized checks are not physical-device tests."
          } > artifacts/transport-preview-report.txt
      - name: Upload screenshot and report
        uses: actions/upload-artifact@v4
        with:
          name: akwantuo-transport-preview
          path: artifacts/
          if-no-files-found: error
