name: Build AKWANTUO GitHub Pages test build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current game
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build game
        run: npm run build --workspace @akwantuo/game

      - name: Upload compiled game only
        uses: actions/upload-artifact@v4
        with:
          name: akwantuo-pages-build
          path: apps/game/dist/
          if-no-files-found: error
          retention-days: 3
